nicht dauerhaft aufhalten und bergen die Gefahr, ihren Einsatz in intransparente R\xE4ume oder andere Forschungsgemeinschaften zu verlagern. Wir m\xFCssen diesen Wandel daher aktiv und gemeinschaftlich gestalten und die daf\xFCr notwendigen Kompetenzen und Rahmenbedingungen entwickeln. So kann KI neue M\xF6glichkeiten f\xFCr mathematisches Entdecken, Verstehen und gemeinsames Forschen er\xF6ffnen."],principles:[{title:"Die Freiheit von Forschung und Lehre muss gewahrt bleiben.",body:"Die Entscheidung dar\xFCber, welche mathematischen Probleme als untersuchenswert gelten und welche Bedeutung Resultate erlangen, muss Gegenstand menschlichen Urteils und wissenschaftlichen Austauschs bleiben. Dies gilt besonders f\xFCr Grundlagenforschung, deren Wert sich h\xE4ufig erst im Nachhinein zeigt. Ob sich ein Problem zur Evaluation oder Vermarktung von KI-Systemen eignet, darf nicht zum ma\xDFgeblichen Kriterium f\xFCr seine wissenschaftliche Bedeutung werden. Die Verantwortung f\xFCr diese Bewertung bleibt bei der mathematischen Gemeinschaft."},{title:"Anforderungen an Korrektheit und \xDCberpr\xFCfbarkeit gelten unabh\xE4ngig vom verwendeten Werkzeug.",body:"Ein inhaltlich oder methodisch relevanter Einsatz von KI muss transparent gemacht werden. KI-gest\xFCtzte Resultate m\xFCssen nachvollziehbar dargestellt und unabh\xE4ngig \xFCberpr\xFCfbar sein. Relevante Vorarbeiten sind sorgf\xE4ltig zu pr\xFCfen und angemessen zu w\xFCrdigen. Der mit Darstellung und \xDCberpr\xFCfung verbundene Aufwand darf nicht einseitig auf die wissenschaftliche Gemeinschaft verlagert werden."},{title:"Autorschaft und wissenschaftliche Anerkennung m\xFCssen neu gedacht werden.",body:"KI kann die Gewinnung und Ver\xF6ffentlichung eines korrekten Resultats vom Verst\xE4ndnis und vom Beitrag der als Autorinnen und Autoren ausgewiesenen Personen entkoppeln. Ein ver\xF6ffentlichtes Resultat allein bietet daher keine hinreichende Grundlage f\xFCr die Begr\xFCndung von Autorschaft oder die Bewertung wissenschaftlicher Kompetenz. Menschliche Beitr\xE4ge und Verantwortlichkeiten m\xFCssen so transparent wie m\xF6glich gemacht und angemessen ber\xFCcksichtigt werden. Dies gilt auch f\xFCr kollektive Forschungsleistungen, deren Beitr\xE4ge sich nicht eindeutig einzelnen Personen zuordnen lassen. Die Kriterien f\xFCr Autorschaft und wissenschaftliche Anerkennung m\xFCssen im Lichte der sich wandelnden Forschungspraxis fortlaufend \xFCberpr\xFCft werden."},{title:"Nicht alles darf delegiert werden.",body:"Die Arbeit mit KI erlaubt es, wichtige Teile mathematischer Forschungsprozesse an automatisierte Prozesse zu delegieren. Wir m\xFCssen bestimmen, welche mathematischen F\xE4higkeiten und Verantwortlichkeiten nicht delegierbar sind. Dazu geh\xF6ren insbesondere kritisches Urteilsverm\xF6gen, auch im Sinne von Kants Begriff der M\xFCndigkeit, sowie die menschliche Verantwortung f\xFCr die Korrektheit ver\xF6ffentlichter Resultate. KI kann die Urteilsbildung unterst\xFCtzen, ohne diese Verantwortung zu \xFCbernehmen."},{title:"Unver\xF6ffentlichte Forschung muss standardm\xE4\xDFig gesch\xFCtzt sein.",body:"Da die Tragweite mathematischer Ideen im Voraus h\xE4ufig nicht absehbar ist, k\xF6nnen Forschende nicht zuverl\xE4ssig entscheiden, welche Gespr\xE4che oder Materialien schutzbed\xFCrftig sind. Institutionelle KI-Zug\xE4nge m\xFCssen sicherstellen, dass Eingaben, Dokumente, Ausgaben und daraus abgeleitete Informationen ausschlie\xDFlich f\xFCr die angeforderte Leistung verwendet werden. Jede weitere Nutzung, insbesondere f\xFCr Training, Modellverbesserung, Evaluation oder eigene Forschung, erfordert eine ausdr\xFCckliche und informierte Zustimmung. Datenspeicherung und Zugriffe sind auf das Erforderliche zu beschr\xE4nken und \xFCberpr\xFCfbar zu regeln. Besonders schutzbed\xFCrftige Forschung kann technisch und institutionell kontrollierte Umgebungen erfordern. Freiwilliges Teilen und gemeinschaftliche Forschung werden dadurch nicht ausgeschlossen; sie setzen eine selbstbestimmte Entscheidung \xFCber Zugang und Nutzung voraus."},{title:"Privilegierter Zugang zu fremden Forschungsinformationen darf nicht ausgenutzt werden.",body:"Der Zugang zu nicht \xF6ffentlichen Ideen oder Forschungsdaten anderer darf nicht genutzt werden, um sich gegen\xFCber den urspr\xFCnglichen Forschenden einen Priorit\xE4tsvorteil zu verschaffen. Dies gilt f\xFCr Forschende, Gutachtende, Anbieter und Institutionen gleicherma\xDFen. Wie bei der Begutachtung von Artikeln oder Antr\xE4gen muss die Vertraulichkeit solcher Informationen gewahrt bleiben. Daf\xFCr braucht es nicht nur individuelle Verantwortung, sondern auch verbindliche und \xFCberpr\xFCfbare Regeln. In Analogie zum Schutz vor Front-Running im Finanzbereich m\xFCssen insbesondere bei Anbietern und Institutionen wirksame technische, organisatorische und vertragliche Informationsbarrieren verhindern, dass solche Informationen unautorisiert in eigene Forschungs- und Verwertungsaktivit\xE4ten einflie\xDFen. Dies gilt unabh\xE4ngig vom technischen Verarbeitungsweg. Zugriffe und Datenfl\xFCsse m\xFCssen nachvollziehbar und unabh\xE4ngig \xFCberpr\xFCfbar sein."},{title:"Besonders betroffene Gruppen m\xFCssen gesch\xFCtzt und beteiligt werden.",body:"Promovierende, Postdocs und Forschende ohne feste Stellen tragen viele der unmittelbaren Risiken dieser Entwicklung. Personen in gesicherten Positionen und Leitungsfunktionen haben eine besondere Verantwortung, die Perspektiven dieser Gruppen einzubeziehen, faire Rahmenbedingungen zu schaffen und ihnen eine echte Beteiligung an den anstehenden Entscheidungen zu erm\xF6glichen. Das erhebliche Machtgef\xE4lle zwischen international t\xE4tigen Technologieunternehmen und einzelnen, h\xE4ufig abh\xE4ngig besch\xE4ftigten Forschenden muss dabei ausdr\xFCcklich ber\xFCcksichtigt werden."},{title:"Der Zugang zu KI darf bestehende Ungleichheiten nicht versch\xE4rfen.",body:"Der Zugang zu geeigneten Werkzeugen und Infrastrukturen sowie zu Fachwissen und Weiterbildung muss fair, international inklusiv und am \xF6ffentlichen Interesse ausgerichtet sein. Internationale mathematische Teilhabe darf nicht vom Zugang zu kostenpflichtigen KI-Systemen abh\xE4ngen. Kritische KI-Infrastruktur f\xFCr die Forschung darf nicht allein von den Interessen einzelner Unternehmen bestimmt werden und bedarf einer wirksamen \xF6ffentlichen Kontrolle. Forschende d\xFCrfen zugleich nicht allein deshalb benachteiligt werden, weil sie bestimmte, insbesondere kommerzielle, KI-Systeme nicht nutzen m\xF6chten."},{title:"Die Regeln m\xFCssen gemeinschaftlich und lernf\xE4hig sein.",body:"Der Umgang mit KI erfordert einen fortlaufenden und transparenten Prozess, in dem die mathematische Gemeinschaft ihre Regeln aufgrund neuer Erfahrungen \xFCberpr\xFCft und weiterentwickelt. Diese Grunds\xE4tze sind angesichts der Ungewissheit \xFCber die weitere Entwicklung ein vorl\xE4ufiger Beitrag zu diesem Prozess. Mit dieser Initiative laden wir dazu ein, sie gemeinsam zu diskutieren und weiterzuentwickeln."}]},en:{title:"AI in Mathematical Research",preamble:["The value of mathematics lies substantially in human engagement with it: in understanding, explaining, thinking together and passing on insights. Mathematics aims not only at producing correct results, but at human insight and understanding, as well as interpreting and communicating results within a shared mathematical culture.","AI is already part of mathematical research, and its importance will continue to grow because of its capabilities and availability. Blanket bans will not permanently halt this development and risk shifting its use into opaque settings or other research communities. We must therefore actively and collectively shape this transition and develop the necessary competencies and conditions. In this way, AI can open up new possibilities for mathematical discovery, understanding and collaborative research."],principles:[{title:"The freedom of research and teaching must be preserved.",body:"Decisions about which mathematical problems are worth studying and what significance results acquire must remain matters of human judgement and scientific exchange. This is particularly true of basic research, whose value often becomes apparent only in retrospect. Whether a problem is suitable for evaluating or marketing AI systems must not become the determining criterion for its scientific significance. Responsibility for this assessment remains with the mathematical community."},{title:"Requirements for correctness and verifiability apply regardless of the tool used.",body:"Any substantively or methodologically relevant use of AI must be disclosed. AI-assisted results must be presented intelligibly and be independently verifiable. Relevant prior work must be carefully checked and appropriately acknowledged. The effort involved in presentation and verification must not be shifted unilaterally onto the scientific community."},{title:"Authorship and scientific recognition must be rethought.",body:"AI can decouple the production and publication of a correct result from the understanding and contribution of the people named as authors. A published result alone therefore does not provide a sufficient basis for establishing authorship or assessing scientific competence. Human contributions and responsibilities must be made as transparent as possible and appropriately taken into account. This also applies to collective research achievements whose contributions cannot be clearly attributed to individuals. Criteria for authorship and scientific recognition must be continually reviewed in light of changing research practices."},{title:"Not everything may be delegated.",body:"Working with AI makes it possible to delegate important parts of mathematical research to automated processes. We must determine which mathematical abilities and responsibilities cannot be delegated. These include, in particular, critical judgement, also in the sense of Kant\u2019s concept of intellectual maturity, and human responsibility for the correctness of published results. AI can support the formation of judgements without assuming this responsibility."},{title:"Unpublished research must be protected by default.",body:"Because the significance of mathematical ideas often cannot be anticipated, researchers cannot reliably decide which conversations or materials require protection. Institutional AI access must ensure that inputs, documents, outputs and information derived from them are used exclusively to provide the requested service. Any further use, in particular for training, model improvement, evaluation or independent research, requires explicit and informed consent. Data storage and access must be limited to what is necessary and governed by verifiable rules. Research requiring particular protection may need technically and institutionally controlled environments. This does not preclude voluntary sharing and collaborative research; they require a self-determined decision about access and use."},{title:"Privileged access to others\u2019 research information must not be exploited.",body:"Access to others\u2019 non-public ideas or research data must not be used to gain a priority advantage over the original researchers. This applies equally to researchers, reviewers, providers and institutions. As in the review of articles or proposals, the confidentiality of such information must be preserved. This requires not only individual responsibility but also binding and verifiable rules. By analogy with safeguards against front-running in finance, effective technical, organisational and contractual information barriers must prevent such information from entering providers\u2019 or institutions\u2019 own research and commercial activities without authorisation. This applies regardless of the technical processing pathway. Access and data flows must be traceable and independently auditable."},{title:"Particularly affected groups must be protected and involved.",body:"Doctoral researchers, postdocs and researchers without permanent positions bear many of the immediate risks of this development. Those in secure positions and leadership roles have a particular responsibility to include these groups\u2019 perspectives, create fair conditions and enable their genuine participation in the decisions ahead. The substantial power imbalance between internationally operating technology companies and individual researchers, often in dependent employment, must be explicitly taken into account."},{title:"Access to AI must not exacerbate existing inequalities.",body:"Access to suitable tools and infrastructure, as well as expertise and training, must be fair, internationally inclusive and oriented towards the public interest. International participation in mathematics must not depend on access to paid AI systems. Critical AI infrastructure for research must not be determined solely by the interests of individual companies and requires effective public oversight. Researchers must not be disadvantaged solely because they do not wish to use particular AI systems, especially commercial ones."},{title:"The rules must be collective and open to learning.",body:"The use of AI requires an ongoing and transparent process in which the mathematical community reviews and develops its rules in light of new experiences. Given the uncertainty about future developments, these principles are a provisional contribution to that process. Through this initiative, we invite the community to discuss and further develop them together."}]}};var Hb={source:"https://www.uni-muenster.de/MathematicsMuenster/ai-math/",asOf:"2026-09-13",links:`<section>

<section>
    <h2>Useful links and resources</h2>

      <article class="resource">

      <article class="resource">
        <h3><a href="https://proofsandprompts.com/" target="_blank" rel="noopener">Proofs and Prompts</a></h3>

        <p>An association advocating for mathematics as a human endeavour and for critical scrutiny of AI\u2019s effects on research, publishing, education, and the mathematical community.</p>

  </section>`};var yl=[{id:"theme-1",title:{de:"Ziele, Fortschritt und Verst\xE4ndnis",en:"Goals, progress and understanding"},questions:[{id:1,text:{de:"Was ist das Ziel der Mathematik, wenn KI immer mehr S\xE4tze beweist?",en:"What is the purpose of mathematics when AI proves more and more theorems?"}},{id:2,text:{de:"Welchen Fortschritt wollen wir: m\xF6glichst schnelle Resultate oder Fortschritt unter selbstbestimmten Bedingungen?",en:"What kind of progress do we want: results as quickly as possible, or progress on our own terms?"}},{id:3,text:{de:"Bleibt menschliche Forschung wichtig, oder sollten wir eine neue Arbeitsteilung abwarten?",en:"Does human research remain important, or should we wait for a new division of labour?"}},{id:4,text:{de:"Was hei\xDFt mathematisches Verst\xE4ndnis, und wie viel davon m\xFCssen Autor:innen selbst besitzen?",en:"What does mathematical understanding mean, and how much of it must authors possess themselves?"}}]},{id:"theme-2",title:{de:"Autorschaft, Transparenz und Anreize",en:"Authorship, transparency and incentives"},questions:[{id:5,text:{de:"Wer darf ein weitgehend KI-erzeugtes Ergebnis als eigene Publikation beanspruchen?",en:"Who may claim a largely AI-generated result as their own publication?"}},{id:6,text:{de:"Wie w\xFCrdigen wir Vorarbeiten und die kollektive Arbeit hinter einem Resultat?",en:"How do we acknowledge prior work and the collective effort behind a result?"}},{id:7,text:{de:"Welche KI-Nutzung muss in einer Publikation offengelegt werden?",en:"Which uses of AI must be disclosed in a publication?"}},{id:8,text:{de:"Wie erm\xF6glichen wir ehrliche Offenlegung, wenn KI-Nutzung oder KI-Verzicht berufliche Nachteile ausl\xF6sen k\xF6nnen?",en:"How can we enable honest disclosure when using or foregoing AI can lead to career disadvantages?"}},{id:9,text:{de:"M\xFCssen Prompts, Denkprotokolle und Rechenaufwand zug\xE4nglich sein?",en:"Must prompts, reasoning traces and computational costs be accessible?"}}]},{id:"theme-3",title:{de:"Korrektheit, Begutachtung und Vermittlung",en:"Correctness, reviewing and communication"},questions:[{id:10,text:{de:"Wie sichern wir Korrektheit, und was leistet ein formaler Beweis?",en:"How do we ensure correctness, and what does a formal proof establish?"}},{id:11,text:{de:"Wer bew\xE4ltigt die Flut von Beweisen und tr\xE4gt die Pr\xFCfungslast?",en:"Who handles the flood of proofs and bears the burden of reviewing?"}},{id:12,text:{de:"Soll KI selbst Gutachten und wissenschaftliche Werturteile verfassen?",en:"Should AI itself write reviews and make judgements of scientific value?"}},{id:13,text:{de:"Wie werden KI-erzeugte Resultate verst\xE4ndlich und f\xFCr weitere mathematische Arbeit nutzbar?",en:"How do AI-generated results become understandable and useful for further mathematical work?"}}]},{id:"theme-4",title:{de:"Leistungsbewertung und Forschungsorientierung",en:"Assessing capabilities and guiding research"},questions:[{id:14,text:{de:"Wie beurteilen wir KI-F\xE4higkeiten jenseits von Erfolgsank\xFCndigungen?",en:"How do we assess AI capabilities beyond announcements of success?"}},{id:15,text:{de:"Wie erhalten wir die \u201Edifficulty landscape\u201C: gemeinsames Wissen dar\xFCber, welche Probleme noch schwierig sind?",en:"How do we preserve the \u201Cdifficulty landscape\u201D: shared knowledge of which problems remain difficult?"}},{id:16,text:{de:"Wie kann KI neue Forschungsfragen erschlie\xDFen, ohne die wissenschaftliche Agenda zu bestimmen?",en:"How can AI open up new research questions without determining the scientific agenda?"}}]},{id:"theme-5",title:{de:"Studium, Promotion und Lernformen",en:"Degree programmes, doctoral study and approaches to learning"},questions:[{id:17,text:{de:"Welche Kompetenzen sollen Studieng\xE4nge k\xFCnftig vermitteln?",en:"Which competencies should degree programmes teach in the future?"}},{id:18,text:{de:"Wie k\xF6nnen Lehrformate Eigenkompetenz und verantwortliche KI-Nutzung verbinden?",en:"How can teaching formats combine independent competence and responsible AI use?"}},{id:19,text:{de:"Wie lernen Studierende mit KI, ohne das eigene Denken auszulagern?",en:"How do students learn with AI without outsourcing their own thinking?"}},{id:20,text:{de:"Wie pr\xFCfen wir Verst\xE4ndnis in Pr\xFCfungen, Abschlussarbeiten und Promotionen?",en:"How do we assess understanding in examinations, final theses and doctorates?"}},{id:21,text:{de:"Welche Ressourcen braucht eine Reform der Mathematiklehre, und wie l\xE4sst sie sich realistisch einf\xFChren?",en:"What resources does reforming mathematics education require, and how can it realistically be introduced?"}}]},{id:"theme-6",title:{de:"Anerkennung und Nachwuchs",en:"Recognition and early-career researchers"},questions:[{id:22,text:{de:"Woran sollen Einstellungen und wissenschaftliche Anerkennung gemessen werden?",en:"What should hiring decisions and scientific recognition be based on?"}},{id:23,text:{de:"Wie erhalten Nachwuchsforschende sinnvolle Arbeit und Entwicklungsm\xF6glichkeiten?",en:"How can early-career researchers retain meaningful work and opportunities to develop?"}}]},{id:"theme-7",title:{de:"Infrastruktur, Zugang und Forschungsschutz",en:"Infrastructure, access and research protection"},questions:[{id:24,text:{de:"Brauchen wir \xF6ffentliche KI-Infrastruktur statt Abh\xE4ngigkeit von wenigen Firmen?",en:"Do we need public AI infrastructure rather than dependence on a few companies?"}},{id:25,text:{de:"Wie verhindern wir, dass finanzschwache Forschende und L\xE4nder abgeh\xE4ngt werden?",en:"How do we prevent researchers and countries with limited financial resources from being left behind?"}},{id:26,text:{de:"Wie sch\xFCtzen wir unver\xF6ffentlichte Forschung vor Nutzung durch KI-Anbieter?",en:"How do we protect unpublished research from use by AI providers?"}},{id:27,text:{de:"Wie verhindern wir Priorit\xE4tsvorteile aus privilegiertem Zugang zu unver\xF6ffentlichter Forschung?",en:"How do we prevent priority advantages arising from privileged access to unpublished research?"}}]},{id:"theme-8",title:{de:"Zusammenarbeit und gesellschaftliche Verantwortung",en:"Collaboration and societal responsibility"},questions:[{id:28,text:{de:"Wie gehen wir mit entschiedener KI-Ablehnung innerhalb der Mathematik um?",en:"How do we engage with firm opposition to AI within mathematics?"}},{id:29,text:{de:"Unter welchen Bedingungen sollte die Gemeinschaft mit KI-Firmen zusammenarbeiten?",en:"Under what conditions should the community collaborate with AI companies?"}},{id:30,text:{de:"Wie ber\xFCcksichtigen wir gesellschaftliche und \xF6kologische Folgen und organisieren gemeinsames Handeln?",en:"How do we account for social and ecological consequences and organise collective action?"}}]}];var oc={asOf:"2026-09-12",questions:{"1":{title:"Was ist das Ziel der Mathematik, wenn KI immer mehr S\xE4tze beweist?",perspectives:[{label:{de:"Scholze et al.",en:"Scholze et al."},body:{de:"Begriffe und menschliches Verst\xE4ndnis entwickeln. Probleml\xF6sungen sollen durch sorgf\xE4ltige Ausarbeitung, Vereinfachung, Gespr\xE4che und Lehre in die mathematische Kultur eingehen.",en:"Develop concepts and human understanding. Solutions should enter mathematical culture through careful exposition, simplification, conversation and teaching."},references:[{id:6,location:"Haupttext"}]},{label:{de:"Bessis",en:"Bessis"},body:{de:"Anerkennung f\xFCr das erstmalige Beweisen eines Satzes war ein unvollkommener Ersatzma\xDFstab f\xFCr Verst\xE4ndnis. Anerkennung und \xF6ffentliche Darstellung sollten sich st\xE4rker an Begriffen, Einsicht und Kl\xE4rung orientieren.",en:"Credit for being the first to prove a theorem was an imperfect proxy for understanding. Recognition and public presentation should focus more on concepts, insight and clarification."},references:[{id:9,location:"\u201EComing clean\u201C"}]},{label:{de:"Kunnawalkam Elayavalli",en:"Kunnawalkam Elayavalli"},body:{de:"Pers\xF6nliche und geteilte Momente des Verstehens, mathematischen Geschmack und kulturelle Erfahrung pflegen. KI daran messen, ob sie diese Erfahrung bereichert; die \xDCberlegenheit einer Maschine entscheidet f\xFCr ihn nicht \xFCber den Wert menschlicher Mathematik.",en:"Cultivate personal and shared moments of understanding, mathematical taste and cultural experience. Judge AI by whether it enriches that experience; a machine\u2019s superiority does not, for him, determine the value of human mathematics."},references:[{id:28,location:"Haupttext"}]},{label:{de:"Wegner: andere Wertbegr\xFCndung",en:"Wegner: a different account of value"},body:{de:"Den Kernwert der Mathematik in Anwendungen sehen, auch \xFCber lange Ketten abstrakter Theorien. Wegner setzt verl\xE4ssliche formale Pr\xFCfung voraus. Solange Menschen Forschungsrichtungen bestimmen und Ergebnisse beurteilen m\xFCssen, soll KI bisher unrealistische Aufgaben erschlie\xDFen und mathematische Werkzeuge mit wissenschaftlichem Bedarf verbinden.",en:"Locate mathematics\u2019 core value in applications, including through long chains of abstract theories. Wegner assumes reliable formal verification. As long as humans must set research directions and assess results, AI should open up previously unrealistic tasks and connect mathematical tools to scientific needs."},references:[{id:68,location:"Annahme A1; Szenario S1; These T2"}]},{label:{de:"Andrew Ng (Bonn)",en:"Andrew Ng (Bonn)"},body:{de:"Menschliches Verst\xE4ndnis auch als Schutz wissenschaftlicher Unabh\xE4ngigkeit bewahren. Seine positive Vorstellung KI-gest\xFCtzter Erkl\xE4rung setzt ethisch und \xF6kologisch vertretbare Bedingungen voraus. Die gegenw\xE4rtigen Bedingungen bewertet Ng als unvertretbar und lehnt deshalb generative Sprachmodelle ab.",en:"Preserve human understanding also as a safeguard for scientific independence. His positive vision of AI-assisted explanation assumes ethically and ecologically acceptable conditions. Ng regards present conditions as unacceptable and therefore rejects generative language models."},references:[{id:44,location:"\u201EWhy is human understanding important?\u201C; \u201EBack to reality...\u201C"}]}]},"2":{title:"Welchen Fortschritt wollen wir: m\xF6glichst schnelle Resultate oder Fortschritt unter selbstbestimmten Bedingungen?",perspectives:[{label:{de:"Tao",en:"Tao"},body:{de:"Leistungsprognosen und Wertentscheidungen trennen. Selbst unter der Annahme sehr leistungsf\xE4higer KI bleiben Erkenntnis, Theoriebildung, Ausbildung und die Zukunft der Gemeinschaft eigenst\xE4ndige Ziele.",en:"Separate predictions about capabilities from value judgements. Even assuming highly capable AI, insight, theory-building, education and the future of the community remain goals in their own right."},references:[{id:59,location:"\xA7\xA74\u20135"}]},{label:{de:"Barak",en:"Barak"},body:{de:"Ein vollst\xE4ndiger KI-Verzicht erscheint ihm f\xFCr anwendungsbezogene akademische Mathematik nicht tragf\xE4hig. Zugleich verteidigt er menschliche Neugier und verst\xE4ndliche Wissenschaft als selbst\xE4ndige Werte; Anwendungen der Grundlagenforschung lassen sich nicht kurzfristig messen.",en:"He does not regard complete abstention from AI as viable for application-oriented academic mathematics. At the same time, he defends human curiosity and intelligible science as values in their own right; the applications of fundamental research cannot be measured over the short term."},references:[{id:7,location:"\u201EImpact of AI on Math\u201C"}]},{label:{de:"Chu",en:"Chu"},body:{de:"Auch um den Preis langsameren Fortschritts die sozialen und ethischen Bedingungen menschlicher Mathematik sch\xFCtzen. Chu fordert einen Boykott der Zusammenarbeit mit KI-Firmen und den Verzicht auf LLMs zur Erzeugung neuer Beweise; einen weltweiten vollst\xE4ndigen Verzicht h\xE4lt sie allerdings f\xFCr schwer durchsetzbar.",en:"Protect the social and ethical conditions of human mathematics, even at the cost of slower progress. Chu calls for a boycott of collaboration with AI companies and for not using LLMs to generate new proofs, although she considers complete worldwide abstention difficult to enforce."},references:[{id:14,location:"\u201ERebuttals...\u201C; \u201ESome radical proposals\u201C"}]},{label:{de:"Stankyavichyus",en:"Stankyavichyus"},body:{de:"Forschung nach dem Nutzen f\xFCr andere bewerten, einschlie\xDFlich nachgelagerter Wissenschaften. Wer verf\xFCgbare Werkzeuge ablehnt und vor allem Bildung als Nutzen nennt, sollte aus seiner Sicht als Lehrender statt f\xFCr Forschung finanziert werden.",en:"Assess research by its benefit to others, including downstream sciences. In his view, those who reject available tools and primarily cite education as their contribution should be funded as teachers rather than as researchers."},references:[{id:54,location:"\u201EAI talking points\u201C"}]},{label:{de:"Nigam",en:"Nigam"},body:{de:"Technischer Fortschritt begr\xFCndet kein Gebot maximaler Beschleunigung. Nutzen und \xDCbergangssch\xE4den gemeinsam bewerten, Betroffene anh\xF6ren und Forschende das Tempo mitbestimmen lassen. Analogien ersetzen diese Abw\xE4gung nicht; ein fertiges \xDCbergangsprogramm bietet sie nicht.",en:"Technical progress does not create an obligation to accelerate as much as possible. Assess benefits alongside harms during the transition, listen to affected people and give researchers a say in the pace. Analogies cannot replace that assessment; she does not offer a complete transition programme."},references:[{id:45,location:"\u201EMy concerns\u201C; \u201EIn closing\u201C"}]}]},"3":{title:"Bleibt menschliche Forschung wichtig, oder sollten wir eine neue Arbeitsteilung abwarten?",perspectives:[{label:{de:"Litt",en:"Litt"},body:{de:"Verstehen, Theoriebildung und Konsolidierung bleiben Aufgaben. Unterschiedliche Interessen und jeweilige St\xE4rken k\xF6nnten eine Arbeitsteilung zwischen Menschen und KI erm\xF6glichen. Einen dauerhaften menschlichen Leistungsvorsprung garantiert Litt nicht.",en:"Understanding, theory-building and consolidation remain tasks. Different interests and respective strengths could enable a division of labour between humans and AI. Litt does not guarantee a lasting human performance advantage."},references:[{id:34,location:"\u201ECreativity\u201C; \u201EThe library\u201C"}]},{label:{de:"Narayanan",en:"Narayanan"},body:{de:"Die F\xE4higkeiten von KI-Modellen, tats\xE4chlich nutzbare Produkte und organisatorischer Wandel sind verschiedene Dinge. Fachwissen, Urteil und Verantwortung st\xE4rken; schnelle technische Fortschritte entscheiden nicht allein dar\xFCber, wie sich Berufe ver\xE4ndern.",en:"AI models\u2019 capabilities, genuinely usable products and organisational change are different things. Strengthen expertise, judgement and responsibility; rapid technical progress alone does not determine how professions change."},references:[{id:43,location:"Vortragstranskript"}]},{label:{de:"Bessis",en:"Bessis"},body:{de:"Jetzt die Ziele und Bewertung mathematischer Arbeit neu ausrichten. Seine Erwartung einer sp\xE4teren Neuordnung enth\xE4lt weder einen Zeitplan noch eine sichere \xDCbergangsstrategie.",en:"Reorient the goals and evaluation of mathematical work now. His expectation of a later reorganisation includes neither a timetable nor a secure transition strategy."},references:[{id:9,location:"\u201EComing clean\u201C; \u201EThe future of mathematics\u201C"}]},{label:{de:"Castillo-Ramirez",en:"Castillo-Ramirez"},body:{de:"Wichtige Fragen ausw\xE4hlen, Ergebnisse pr\xFCfen, ordnen und verbinden; in der Lehre Begeisterung, Vertrauen und Ausdauer vermitteln. Sein erwarteter Rollenwandel ist keine Garantie dauerhafter menschlicher \xDCberlegenheit in diesen Aufgaben.",en:"Select important questions, check results, organise them and make connections; in teaching, convey enthusiasm, trust and perseverance. His anticipated change of roles does not guarantee lasting human superiority in these tasks."},references:[{id:12,location:"\u201EThe End of Handcrafted Mathematics\u201C; \u201ETeaching Will Remain Human\u201C"}]}]},"4":{title:"Was hei\xDFt mathematisches Verst\xE4ndnis, und wie viel davon m\xFCssen Autor:innen selbst besitzen?",perspectives:[{label:{de:"Thurston",en:"Thurston"},body:{de:"Verstehen umfasst verschiedene mentale Zug\xE4nge: Bilder, Sprache, Intuition, logische Struktur und Verfahren. Ma\xDFgeblich ist, ob andere klarer denken k\xF6nnen; die Kenntnis des Wahrheitswerts oder einer formalen Ableitung ersch\xF6pft dies nicht.",en:"Understanding encompasses different mental approaches: images, language, intuition, logical structure and procedures. What matters is whether others can think more clearly; knowing a truth value or a formal derivation does not exhaust this."},references:[{id:65,location:"\xA7\xA71\u20133"}]},{label:{de:"Tao",en:"Tao"},body:{de:"Tao schl\xE4gt als Publikationsschwelle vor, dass die Autorenschaft die Ergebnisse korrekt, sachkundig, verst\xE4ndlich und mit angemessener Zuschreibung vortragen kann. Das ist ein Bef\xE4higungskriterium, keine allgemeine Pflicht zur Einreichung eines Vortrags.",en:"Tao proposes a publication threshold: the authors should be capable of presenting their results correctly, knowledgeably, intelligibly and with appropriate attribution. This is a capability criterion, not a general requirement to submit a talk."},references:[{id:59,location:"\xA78"}]},{label:{de:"Tao zur Arbeitsteilung",en:"Tao on the division of labour"},body:{de:"Formale Beweisassistenten erlauben, Teilaufgaben eines Formalisierungsprojekts getrennt zu pr\xFCfen. Tao h\xE4lt eine entsprechende Arbeitsteilung auch bei neuen Resultaten f\xFCr m\xF6glich: Einzelne k\xF6nnten spezialisierte Beitr\xE4ge leisten, ohne das Gesamtprojekt vollst\xE4ndig zu verstehen. Daf\xFCr m\xFCsste die Formalisierung noch effizienter werden.",en:"Formal proof assistants allow subtasks of a formalisation project to be checked separately. Tao considers a similar division of labour possible for new results: individuals could make specialised contributions without fully understanding the entire project. Formalisation would need to become more efficient for this."},references:[{id:58,location:"\xA71, S.4"}]},{label:{de:"Stankyavichyus: Gegenposition",en:"Stankyavichyus: a contrasting position"},body:{de:"F\xFCr die Publikationsw\xFCrdigkeit Neuheit, Korrektheit, Wirkung und Begutachtung gen\xFCgen lassen; die pers\xF6nliche Kenntnis bei Einstellungen pr\xFCfen. Damit trennt er den Wert eines Textes vom Verst\xE4ndnis seiner Autor:innen.",en:"Let novelty, correctness, impact and peer review suffice for publication; assess personal knowledge in hiring. He thus separates the value of a text from its authors\u2019 understanding."},references:[{id:54,location:"\u201EAI talking points\u201C"}]},{label:{de:"Shalit",en:"Shalit"},body:{de:"Schon bisher beruhte Forschung auf etablierten fremden S\xE4tzen und arbeitsteiliger Expertise. Alles bis zu den Grundlagen selbst nachzuvollziehen, sei unhaltbar. KI versch\xE4rft diese Abh\xE4ngigkeit; eine allgemeine neue Grenze akzeptablen Vertrauens gibt er nicht an.",en:"Research has long depended on other people\u2019s established theorems and distributed expertise. Personally tracing everything back to its foundations is untenable. AI intensifies this dependence; he gives no general new boundary for acceptable trust."},references:[{id:51,location:"\u201EStanding on thin air\u201C"}]},{label:{de:"Rivera: strenger Ausbildungsma\xDFstab",en:"Rivera: a stricter educational standard"},body:{de:"Rivera schreibt seinen Promovierenden die Offenlegung der KI-Nutzung vor und empfiehlt dringend, sie einzuschr\xE4nken. Verwendete Aussagen sollen unabh\xE4ngig von ihrer Herkunft vollst\xE4ndig verstanden werden; in Betreuungsgespr\xE4chen fragt er bis zu grundlegenden Prinzipien nach. Dies ist seine pers\xF6nliche Betreuungspolitik.",en:"Rivera requires his doctoral students to disclose AI use and strongly recommends limiting it. Statements used should be fully understood regardless of their origin; in supervision meetings, he asks questions down to fundamental principles. This is his personal supervision policy."},references:[{id:48,location:"Abs\xE4tze \xFCber Offenlegung, Nutzungseinschr\xE4nkung und Verst\xE4ndnis"}]}]},"5":{title:"Wer darf ein weitgehend KI-erzeugtes Ergebnis als eigene Publikation beanspruchen?",perspectives:[{label:{de:"Etingof",en:"Etingof"},body:{de:"Menschliche Autor:innen k\xF6nnen volle Anerkennung erhalten, auch wenn KI Beweise geliefert hat, sofern sie den Inhalt selbst vollst\xE4ndig pr\xFCfen, verstehen, erkl\xE4ren und verantworten k\xF6nnen sowie die KI-Beitr\xE4ge benennen.",en:"Human authors can receive full credit, even when AI supplied proofs, provided they can personally check, understand, explain and take responsibility for the content, and identify the AI contributions."},references:[{id:18,location:"\xA71, S.1\u20132; \xA77, S.8"}]},{label:{de:"Weinreich",en:"Weinreich"},body:{de:"Eine nachtr\xE4glich erweiterbare Mitinhaberschaft an mathematischen Ideen als Anerkennungsmodell erproben: Auch sp\xE4ter kann hinzukommen, wer Verst\xE4ndnis auf Autorenniveau nachweist; Zeitschriften sollen den Nachweis organisieren.",en:"Try a model of recognition in which co-ownership of mathematical ideas can be extended later: anyone who subsequently demonstrates author-level understanding can join; journals should organise this demonstration."},references:[{id:70,location:"\xA72: \u201EFor journals\u201C"}]},{label:{de:"Lazi\u0107",en:"Lazi\u0107"},body:{de:"Ein blo\xDFer Prompt begr\xFCndet keine Autorschaft. Eigene Theoriebildung oder Beweisarbeit ist f\xFCr ihn konstitutiv f\xFCr mathematische Forschung.",en:"A prompt alone does not establish authorship. For him, doing one\u2019s own theory-building or proof work is constitutive of mathematical research."},references:[{id:30,location:"Grundsatz 6"}]},{label:{de:"Thom",en:"Thom"},body:{de:"Ein korrektes KI-Resultat kann ver\xF6ffentlichungsw\xFCrdig sein, ohne menschliche Entdeckung oder Verst\xE4ndnis zu belegen. Nicht zuordenbare Anerkennung soll nicht automatisch an den Modellbetreiber gehen. Auch bei gekl\xE4rtem Datenschutz h\xE4lt Thom das bisherige System pers\xF6nlicher Priorit\xE4t f\xFCr kaum tragf\xE4hig: Publikationen belegen nicht mehr zuverl\xE4ssig den Beitrag und die F\xE4higkeiten ihrer Autor:innen.",en:"A correct AI result can merit publication without demonstrating human discovery or understanding. Credit that cannot be attributed should not automatically go to the model operator. Even with data protection settled, Thom considers the existing system of personal priority barely sustainable: publications no longer reliably demonstrate their authors\u2019 contributions and abilities."},references:[{id:63,location:"Schlussteil"}]},{label:{de:"Thom",en:"Thom"},body:{de:"Das Spektrum vom blo\xDFen Prompt bis zu entscheidender mathematischer Mitarbeit ber\xFCcksichtigen. Wie dieser Anteil verl\xE4sslich gepr\xFCft und zugeschrieben werden kann, bleibt eine offene Frage.",en:"Account for the spectrum from a mere prompt to decisive mathematical collaboration. How that contribution can be reliably checked and attributed remains an open question."},references:[{id:64,location:"Punkt 1"}]}]},"6":{title:"Wie w\xFCrdigen wir Vorarbeiten und die kollektive Arbeit hinter einem Resultat?",perspectives:[{label:{de:"Leiden-Erkl\xE4rung",en:"Leiden Declaration"},body:{de:"Bei KI-erzeugten Ergebnissen die zugrunde liegenden menschlichen Arbeiten ermitteln und w\xFCrdigen. Falls deren Zuschreibung trotz Bem\xFChungen unzureichend bleibt, dies ausdr\xFCcklich offenlegen.",en:"Identify and acknowledge the underlying human work behind AI-generated results. If attribution remains inadequate despite efforts, explicitly disclose this."},references:[{id:33,location:"\u201EPut effort into proper attribution\u201C"}]},{label:{de:"Ochigame",en:"Ochigame"},body:{de:"Anerkennung von der Erstver\xF6ffentlichung auf schrittweise kollektive Arbeit verlagern, einschlie\xDFlich Programmierung, Datenarbeit, Formalisierung und Erkl\xE4rung; Beitr\xE4ge gerechter verg\xFCten.",en:"Shift recognition from first publication towards incremental collective work, including programming, data work, formalisation and explanation; reward contributions more fairly."},references:[{id:46,location:"\xA75"}]},{label:{de:"Avigad",en:"Avigad"},body:{de:"Am Beispiel der Formalisierung des Kugelpackungssatzes fordert Avigad, menschliche Vorarbeit angemessen anzuerkennen und KI-erzeugten Code gemeinsam mit dem Projektteam auf dessen Standards zu bringen.",en:"Using the formalisation of the sphere-packing theorem as an example, Avigad calls for appropriate recognition of prior human work and for bringing AI-generated code up to the project\u2019s standards together with its team."},references:[{id:4,location:"\xA72"}]}]},"7":{title:"Welche KI-Nutzung muss in einer Publikation offengelegt werden?",perspectives:[{label:{de:"Hairer",en:"Hairer"},body:{de:"Offenlegen, welche wesentlichen mathematischen Ideen oder Beweise von KI stammen. Routinem\xE4\xDFige Sprachkorrektur und Literatursuche m\xFCssen nach Hairers Vorschlag nicht angegeben werden.",en:"Disclose which substantial mathematical ideas or proofs came from AI. Under Hairer\u2019s proposal, routine language correction and literature searches need not be declared."},references:[{id:22,location:"\u201EDisclosure\u201C"}]},{label:{de:"LMS",en:"LMS"},body:{de:"F\xFCr ihre Zeitschriften verlangt die London Mathematical Society die Erkl\xE4rung s\xE4mtlicher KI-Nutzungen, einschlie\xDFlich Sprachhilfe. Menschliche Autor:innen tragen die volle Verantwortung; generative KI darf nicht als Autor:in aufgef\xFChrt werden.",en:"For its journals, the London Mathematical Society requires disclosure of all AI use, including language assistance. Human authors bear full responsibility; generative AI may not be listed as an author."},references:[{id:36,location:"\xA7\xA72.1.5, 2.5"}]}]},"8":{title:"Wie erm\xF6glichen wir ehrliche Offenlegung, wenn KI-Nutzung oder KI-Verzicht berufliche Nachteile ausl\xF6sen k\xF6nnen?",perspectives:[{label:{de:"Klowden und Tao",en:"Klowden and Tao"},body:{de:"Verantwortliche Nutzung kann sowohl durch r\xFCcksichtslosen Wettbewerb als auch durch pauschale Ausgrenzung verdr\xE4ngt werden. Gute Praxis, Ausbildung und gezielte Regulierung sollen hilfreiche Nutzung f\xF6rdern und sch\xE4dliche oder verdeckte Nutzung begrenzen.",en:"Responsible use can be driven out both by reckless competition and by blanket exclusion. Good practice, education and targeted regulation should encourage helpful use and limit harmful or concealed use."},references:[{id:27,location:"\xA75.4"}]},{label:{de:"Stankyavichyus",en:"Stankyavichyus"},body:{de:"Besch\xE4mung und Sanktionen allein wegen KI-Nutzung zur\xFCckweisen. Normen, die dauerhaft Besch\xE4ftigte setzen, k\xF6nnen besonders hohe berufliche Kosten f\xFCr ihre Studierenden und prek\xE4r Besch\xE4ftigte haben.",en:"Reject shaming and sanctions solely for using AI. Norms set by permanently employed researchers can impose particularly high career costs on their students and precariously employed colleagues."},references:[{id:54,location:"\u201EOn dangers of dehumanizing colleagues\u201C"}]},{label:{de:"Ruodu Wang",en:"Ruodu Wang"},body:{de:"Wenn vor allem die erste L\xF6sung Anerkennung erh\xE4lt und ungepr\xFCfte KI-\xDCbernahmen nicht erkennbar sind, geraten sorgf\xE4ltig pr\xFCfende Autor:innen nach Wangs Gedankenmodell ins Hintertreffen. Geringere Priorit\xE4tspr\xE4mien l\xF6sen dies nicht, solange sp\xE4tere Arbeiten leer ausgehen. Einen geeigneten Ersatzma\xDFstab gerade f\xFCr Nachwuchsforschende l\xE4sst er offen.",en:"In Wang\u2019s thought experiment, if the first solution receives most of the credit and unchecked adoption of AI output is undetectable, authors who check carefully are disadvantaged. Reducing priority rewards does not solve this while later work receives nothing. He leaves open a suitable replacement metric, especially for early-career researchers."},references:[{id:67,location:"Annahmen i\u2013iii; Schlussabs\xE4tze"}]}]},"9":{title:"M\xFCssen Prompts, Denkprotokolle und Rechenaufwand zug\xE4nglich sein?",perspectives:[{label:{de:"Boldt",en:"Boldt"},body:{de:"Exakte Modellversion, Prompts und Steuerungssoftware offenlegen; auch nichtdeterministische Experimente bleiben wissenschaftlich nachvollziehbar und untersuchbar.",en:"Disclose the exact model version, prompts and orchestration software; even nondeterministic experiments remain open to scientific scrutiny and investigation."},references:[{id:10,location:"\xA75"}]},{label:{de:"Hairer",en:"Hairer"},body:{de:"Verf\xFCgbare Denkprotokolle k\xF6nnen helfen; allgemeine Pflichten f\xFCr Prompts und Verbrauchsdaten h\xE4lt er wegen Verf\xFCgbarkeit und fehlender Reproduzierbarkeit f\xFCr unpraktisch.",en:"Available reasoning traces can help; he considers general requirements to provide prompts and consumption data impractical because of availability and lack of reproducibility."},references:[{id:22,location:"\u201EDisclosure\u201C"}]},{label:{de:"Gonen Cohen",en:"Gonen Cohen"},body:{de:"Als Diskussionsoptionen nennt Gonen Cohen \xF6ffentliche Zug\xE4nge, Zugang auf Anfrage oder f\xFCr vertrauensw\xFCrdige Pr\xFCfer:innen. Prompt- und Werkzeugverl\xE4ufe k\xF6nnten einen Kompromiss bilden; Denkprotokolle spiegeln die tats\xE4chliche Entstehung einer Antwort nicht notwendig zuverl\xE4ssig wider.",en:"Gonen Cohen discusses public access, access on request or access for trusted reviewers as possible options. Prompt and tool histories might offer a compromise; reasoning traces do not necessarily reliably reflect how an answer was actually produced."},references:[{id:20,location:"\u201EIn what format...\u201C; \u201EWhat next?\u201C"}]}]},"10":{title:"Wie sichern wir Korrektheit, und was leistet ein formaler Beweis?",perspectives:[{label:{de:"Ringer",en:"Ringer"},body:{de:"Erzeugung und Pr\xFCfung trennen: Ein kleiner Pr\xFCfkern kontrolliert das formale Beweisobjekt unabh\xE4ngig von der Zuverl\xE4ssigkeit des erzeugenden Systems.",en:"Separate generation from checking: a small kernel checks the formal proof object independently of the reliability of the system that generated it."},references:[{id:47,location:"\u201EProof Assistants\u201C, S.2; \u201EChoosing a Proof Assistant\u201C, S.3"}]},{label:{de:"Etingof und Sutherland",en:"Etingof and Sutherland"},body:{de:"Argumente selbst pr\xFCfen, verstehen und erkl\xE4ren. Bei Formalisierung zus\xE4tzlich kontrollieren, ob der kodierte Satz der beabsichtigten Aussage entspricht; mehrere zustimmende Modelle ersetzen keinen Beweis.",en:"Personally check, understand and explain arguments. For formalisation, also verify that the encoded theorem matches the intended statement; agreement among several models is not a proof."},references:[{id:18,location:"\xA71; \xA74.4; \xA74.6 (Andrew Sutherland)"}]},{label:{de:"Boldt",en:"Boldt"},body:{de:"Wer durch Sprachmodelle gewonnene mathematische Ergebnisse ver\xF6ffentlicht, soll eine maschinenpr\xFCfbare Formalisierung bereitstellen. Das ist Boldts Normvorschlag, keine allgemein geltende Regel.",en:"Those publishing mathematical results obtained through language models should provide a machine-checkable formalisation. This is Boldt\u2019s proposed norm, not a generally applicable rule."},references:[{id:10,location:"\xA74"}]},{label:{de:"Klowden und Tao",en:"Klowden and Tao"},body:{de:"Eine Formalisierung kontrolliert nicht automatisch, ob die kodierte Aussage die beabsichtigte ist. Motivation, Heuristik und \xDCbertragbarkeit bleiben zus\xE4tzliche Erkenntnisleistungen.",en:"Formalisation does not automatically check whether the encoded statement is the intended one. Motivation, heuristics and transferability remain additional contributions to knowledge."},references:[{id:27,location:"\xA74.4"}]},{label:{de:"Weinberger",en:"Weinberger"},body:{de:"\xDCberzeugende Gespr\xE4che nicht mit Zuverl\xE4ssigkeit verwechseln. An kritischem Austausch mit Kolleg:innen festhalten und einen formalen Beleg oder detailliertes unabh\xE4ngiges Verst\xE4ndnis verlangen; sprachliche \xDCberzeugungskraft kann das eigene Urteil unbemerkt verschieben.",en:"Do not confuse convincing conversation with reliability. Maintain critical exchanges with colleagues and require formal evidence or detailed independent understanding; linguistic persuasiveness can shift one\u2019s judgement unnoticed."},references:[{id:69,location:"Haupttext"}]},{label:{de:"Lee",en:"Lee"},body:{de:"Drei Ebenen unterscheiden: Beweis des formalen Satzes aus den verwendeten Axiomen, richtige \xDCbersetzung der beabsichtigten Aussage und \xDCbereinstimmung mit der urspr\xFCnglichen informellen Beweisf\xFChrung. Ein formal korrekter anderer Beweis best\xE4tigt nicht automatisch die urspr\xFCngliche Argumentation.",en:"Distinguish three levels: proving the formal theorem from the axioms used, correctly translating the intended statement, and agreement with the original informal proof. A formally correct different proof does not automatically confirm the original argument."},references:[{id:32,location:"\u201EDo you want to (auto)formalize a theorem or a proof?\u201C"}]}]},"11":{title:"Wer bew\xE4ltigt die Flut von Beweisen und tr\xE4gt die Pr\xFCfungslast?",perspectives:[{label:{de:"Leiden-Erkl\xE4rung",en:"Leiden Declaration"},body:{de:"Autor:innen sollen Pr\xFCfung durch pr\xE4zise Referenzen und geeignete formale Beweise erleichtern; Fachorganisationen k\xF6nnten zus\xE4tzliche menschliche Darstellungen oder externe Vorpr\xFCfung verlangen.",en:"Authors should facilitate checking through precise references and appropriate formal proofs; professional organisations could require additional human exposition or external pre-screening."},references:[{id:33,location:"\u201ESupport the needs of reviewing\u201C; \u201EMaintain standards of rigor\u201C"}]},{label:{de:"Litt",en:"Litt"},body:{de:"KI-Vorpr\xFCfung erw\xE4gen, aber Fehlentscheidungen ber\xFCcksichtigen. Kautionen oder Zugang nur f\xFCr vertraute Autor:innen diskutiert er als problematische, nicht als w\xFCnschenswerte Schranken.",en:"Consider AI pre-screening, while accounting for erroneous decisions. He discusses deposits or restricting access to trusted authors as problematic barriers, not desirable ones."},references:[{id:34,location:"\u201ETruth-seeking\u201C"}]},{label:{de:"First Proof",en:"First Proof"},body:{de:"Beim KI-Testprojekt First Proof beurteilen unabh\xE4ngige Fachgutachter:innen die L\xF6sungen. Nach dem Bericht finanzieren ungebundene Unternehmensspenden unter anderem Forschungszuwendungen f\xFCr die Gutachter:innen; Herausgebergremium und Vorstand werden daraus nicht verg\xFCtet.",en:"In the AI evaluation project First Proof, independent expert reviewers assess the solutions. According to the report, unrestricted corporate donations fund, among other things, research grants for reviewers; the editorial panel and board are not remunerated from these funds."},references:[{id:1,location:"\xA7\xA72.3\u20132.4, S.10\u201311"}]},{label:{de:"Mangioni",en:"Mangioni"},body:{de:"Als m\xF6gliches Modell erw\xE4gt er KI-gest\xFCtzte Erzeugung bei menschlicher Pr\xFCfung und Aneignung der Mathematik. Begutachtung k\xF6nnte eine regul\xE4re Arbeitsaufgabe mit reservierter Zeit werden. F\xFCr KI-Anwendungen insgesamt fordert er klare Grenzen und schnell anpassbare Korrekturmechanismen.",en:"He considers a possible model of AI-assisted generation with human checking and assimilation of the mathematics. Reviewing could become a regular work duty with allocated time. For AI applications overall, he calls for clear limits and rapidly adaptable corrective mechanisms."},references:[{id:39,location:"\u201EThe social context lens\u201C; \u201EThe ethical lens\u201C"}]}]},"12":{title:"Soll KI selbst Gutachten und wissenschaftliche Werturteile verfassen?",perspectives:[{label:{de:"Narayanan",en:"Narayanan"},body:{de:"Routineaufgaben automatisieren, wertende Entscheidungen bei Menschen belassen. Sonst verlieren Forschende Einfluss auf die Entwicklung ihres Fachs.",en:"Automate routine tasks while leaving evaluative decisions to people. Otherwise, researchers lose influence over the development of their field."},references:[{id:43,location:"Schlussteil"}]},{label:{de:"LMS",en:"LMS"},body:{de:"F\xFCr ihre Zeitschriften untersagt die London Mathematical Society KI-Begutachtung und ManuskriptUploads in KI-Systeme. Gutachtende d\xFCrfen einen selbst verfassten Bericht sprachlich verbessern lassen, m\xFCssen dies offenlegen und d\xFCrfen nur den Berichtstext \xFCbermitteln.",en:"For its journals, the London Mathematical Society prohibits AI reviewing and uploading manuscripts to AI systems. Reviewers may have a report they wrote themselves linguistically improved, but must disclose this and may transmit only the report text."},references:[{id:36,location:"\xA7\xA73.5, 4.6"}]}]},"13":{title:"Wie werden KI-erzeugte Resultate verst\xE4ndlich und f\xFCr weitere mathematische Arbeit nutzbar?",perspectives:[{label:{de:"Etingof (nach einem Kommentar von Paul Seidel)",en:"Etingof (following a comment by Paul Seidel)"},body:{de:"Ver\xF6ffentlichende m\xFCssen Ideen durch Erkl\xE4rungen, Gespr\xE4che und Vortr\xE4ge in gemeinsames Wissen \xFCberf\xFChren; ein arXiv-Upload allein gen\xFCgt nicht.",en:"Those publishing must turn ideas into shared knowledge through explanations, conversations and talks; an arXiv upload alone is not enough."},references:[{id:18,location:"Bemerkung 5.1, S.8"}]},{label:{de:"Macbeth",en:"Macbeth"},body:{de:"Formale Texte als eigenes mathematisches Medium gestalten: wiederkehrende Argumente durch geeignete Begriffe und allgemeine Hilfss\xE4tze organisieren, Berechnung und Abstraktion verbinden.",en:"Develop formal texts as a mathematical medium in their own right: organise recurring arguments using appropriate concepts and general auxiliary lemmas, and connect computation with abstraction."},references:[{id:38,location:"\xA7\xA72\u20134"}]},{label:{de:"Donoho",en:"Donoho"},body:{de:"F\xFCr datenbasierte Wissenschaft Daten, Programme und mit geringem Aufwand reproduzierbare Berechnungen offen bereitstellen und gemeinsame Vergleichsverfahren nutzen. Der Aufbau fehlender Datens\xE4tze und Vergleichsaufgaben kann selbst ein bedeutender Forschungsbeitrag sein.",en:"For data-based science, openly provide data, programs and computations that can be reproduced with little effort, and use shared benchmarking procedures. Creating missing datasets and benchmark tasks can itself be a significant research contribution."},references:[{id:16,location:"\xA710.1"}]},{label:{de:"Tao",en:"Tao"},body:{de:"Formalisierung kann \xFCberfl\xFCssige Voraussetzungen und einfachere Wege sichtbar machen und eine wiederverwendbare Bibliothek erweitern; blo\xDFe Zertifizierung ist nur ein m\xF6glicher Zweck.",en:"Formalisation can reveal unnecessary assumptions and simpler approaches and expand a reusable library; certification alone is only one possible purpose."},references:[{id:58,location:"\xA71, S.3\u20134"}]},{label:{de:"Cheung",en:"Cheung"},body:{de:"Au\xDFenstehenden erkl\xE4ren, warum ein Problem und seine L\xF6sung interessieren. \xD6ffentlichkeitsarbeit kann gesellschaftliche Unterst\xFCtzung, eigenes Verst\xE4ndnis und bessere fachliche Darstellung f\xF6rdern; Korrektheit allein vermittelt die Bedeutung noch nicht.",en:"Explain to outsiders why a problem and its solution are interesting. Public communication can foster social support, one\u2019s own understanding and better mathematical exposition; correctness alone does not convey significance."},references:[{id:13,location:"\u201ELessons for academia?\u201C; \u201EA plea...\u201C"}]},{label:{de:"Thom",en:"Thom"},body:{de:"Ein formaler Beweis best\xE4tigt ein mathematisches Resultat; dessen Bedeutung, Erkl\xE4rung und Einordnung verlangen weitere Arbeit. Diese Aneignung ist f\xFCr Thom selbst Forschung.",en:"A formal proof confirms a mathematical result; its significance, explanation and contextualisation require further work. For Thom, this process of making the mathematics one\u2019s own is itself research."},references:[{id:63,location:"Schlussabs\xE4tze"}]}]},"14":{title:"Wie beurteilen wir KI-F\xE4higkeiten jenseits von Erfolgsank\xFCndigungen?",perspectives:[{label:{de:"First Proof",en:"First Proof"},body:{de:"First Proof testet KI an Forschungsaufgaben, deren menschliche L\xF6sungen bereits vorliegen, aber noch unver\xF6ffentlicht sind. L\xF6sungen, Protokolle, Kosten und Steuerungscode werden offengelegt; zwei bis drei Fachgutachter:innen beurteilen anonymisiert. Begriffsentwicklung und das Finden interessanter Vermutungen erfasst dieser Test nicht.",en:"First Proof tests AI on research tasks whose human solutions already exist but remain unpublished. Solutions, logs, costs and orchestration code are disclosed; two to three expert reviewers assess them anonymously. This test does not capture concept development or finding interesting conjectures."},references:[{id:1,location:"\xA7\xA71.1\u20131.3, 2.1\u20132.4"}]},{label:{de:"Narayanan",en:"Narayanan"},body:{de:"Neben Erfolgsquoten pr\xFCfen, ob die KI wiederholt zuverl\xE4ssig arbeitet, auf kleine \xC4nderungen robust reagiert, eigene Fehler richtig einsch\xE4tzt und ob Fehler beherrschbare Folgen haben.",en:"Beyond success rates, assess whether AI works reliably on repeated attempts, is robust to small changes, correctly estimates its own errors and produces errors with manageable consequences."},references:[{id:43,location:"Abs\xE4tze zur Verl\xE4sslichkeit"}]},{label:{de:"Bessis",en:"Bessis"},body:{de:"Eine breitere Automatisierungsskala entwickeln, die auch Vereinfachung, Fragestellung, Begriffs- und Theoriebildung erfasst.",en:"Develop a broader scale of automation that also covers simplification, formulating questions, and developing concepts and theories."},references:[{id:9,location:"\u201EComing clean\u201C"}]},{label:{de:"Lan",en:"Lan"},body:{de:"\xD6ffentlich verf\xFCgbare Modelle systematisch an offenen Problemen pr\xFCfen, Ausgaben unabh\xE4ngig kontrollieren und Nutzung offenlegen. Die Gemeinschaft soll Bedeutung und Leistung selbst beurteilen; seine weitergehenden Vermutungen \xFCber Firmenmotive sind keine Nachweise.",en:"Systematically test publicly available models on open problems, independently check outputs and disclose use. The community should assess significance and performance itself; his further conjectures about companies\u2019 motives are not evidence."},references:[{id:29,location:"Abs\xE4tze zu \xF6ffentlichen Tests und Begutachtung"}]}]},"15":{title:"Wie erhalten wir die \u201Edifficulty landscape\u201C: gemeinsames Wissen dar\xFCber, welche Probleme noch schwierig sind?",perspectives:[{label:{de:"Tao: Diagnose",en:"Tao: diagnosis"},body:{de:"Schwierigkeit ist relativ zu bekannten Methoden: Was ist leicht, mit Aufwand oder noch nicht erreichbar? Tao sieht die Orientierung durch raschen KI-Fortschritt und fehlende Offenlegung erfolgloser Versuche und L\xF6sungsprozesse durch KI-Firmen gef\xE4hrdet. Der Wettbewerb um aussichtsreiche Probleme k\xF6nne Forschende zur Geheimhaltung bewegen.",en:"Difficulty is relative to known methods: what is easy, achievable with effort or still out of reach? Tao sees this orientation threatened by rapid AI progress and AI companies\u2019 failure to disclose unsuccessful attempts and solution processes. Competition for promising problems could encourage researchers to become secretive."},references:[{id:61,location:"Teile 2\u20133"}]},{label:{de:"Tao: Vorschlag",en:"Tao: proposal"},body:{de:"F\xFCr viele Problemklassen gemeinsame Standards entwickeln: Eine L\xF6sung soll auch Einsichten aus ihrem Entstehungsprozess und das Verst\xE4ndnis verwandter Schwierigkeiten erschlie\xDFen. Ein Ergebnis ohne diese Analyse kann f\xFCr die weitere Forschungsorientierung wenig oder sogar negativen Wert haben.",en:"Develop shared standards for many classes of problems: a solution should also provide insights from the process that produced it and understanding of related difficulties. Without this analysis, a result may have little or even negative value for further research orientation."},references:[{id:61,location:"Teil 4"}]},{label:{de:"Gonen Cohen",en:"Gonen Cohen"},body:{de:"Zur Diskussion stellen, ob erfolglose L\xE4ufe und ihre Kosten ebenfalls offenzulegen sind, in welchem Umfang und gegen\xFCber wem. Er legt sich auf keine allgemeine Ver\xF6ffentlichungspflicht fest; nur erfolgreiche Protokolle k\xF6nnen den Gesamtaufwand verdecken.",en:"Discuss whether unsuccessful runs and their costs should also be disclosed, to what extent and to whom. He does not commit to a general publication requirement; reporting only successful traces can conceal the total effort."},references:[{id:20,location:"\u201EWhat next?\u201C"}]}]},"16":{title:"Wie kann KI neue Forschungsfragen erschlie\xDFen, ohne die wissenschaftliche Agenda zu bestimmen?",perspectives:[{label:{de:"Tao",en:"Tao"},body:{de:"Tao beschreibt ein Zusammenspiel von maschineller Mustererkennung, menschlicher Vermutungsbildung, Gegenpr\xFCfung und Beweisarbeit. Eine Fallstudie aus der Knotentheorie zeigt, wie daraus neue Einsichten entstehen k\xF6nnen; sie begr\xFCndet keine allgemeine Leistungsprognose.",en:"Tao describes an interplay of machine pattern recognition, human conjecture formation, cross-checking and proof work. A case study in knot theory shows how this can produce new insights; it does not establish a general performance forecast."},references:[{id:58,location:"\xA72, S.5\u20136"}]},{label:{de:"Guanyang Wang",en:"Guanyang Wang"},body:{de:"Als m\xF6gliche Arbeitsteilung schl\xE4gt Wang vor: Menschen geben einen Beweisplan mit offenen Zwischenschritten vor, KI hilft bei diesen Schritten. Zudem berichtet er erfolgreiche und gescheiterte L\xE4ufe zweier Prompts. Der nach Kenntnis des Beweises entworfene Promptvergleich erlaubt keine allgemeine Erfolgsprognose.",en:"Wang proposes a possible division of labour: humans supply a proof plan with open intermediate steps, and AI helps with those steps. He also reports successful and failed runs of two prompts. The prompt comparison, devised with knowledge of the proof, does not allow a general prediction of success."},references:[{id:66,location:"\u201EThe Right Prompt\u201C; \u201EA Hypothetical Example\u201C"}]},{label:{de:"Hartstein",en:"Hartstein"},body:{de:"Automatisches Beweisen breiter als Sprachmodelle erforschen, auch mit symbolischen und kombinierten Verfahren. Seine Ziele sind \xFCberpr\xFCfbare Korrektheit, das grunds\xE4tzliche Auffinden jedes im gew\xE4hlten formalen System existierenden Beweises und effiziente Suche. Eine allgemeine praktische Erreichbarkeit aller Ziele weist er nicht nach.",en:"Research automated proving more broadly than language models, including symbolic and hybrid approaches. His goals are verifiable correctness, the ability in principle to find any proof that exists in the chosen formal system, and efficient search. He does not demonstrate that all these goals are generally achievable in practice."},references:[{id:23,location:"\u201EThe Actual Goal\u201C; \u201EThe G\xF6del Objection\u201C; \u201EThe Future\u201C"}]},{label:{de:"Avigad",en:"Avigad"},body:{de:"Formale Bibliotheken, symbolische Verfahren, Experimente und neue Formen der Interaktion mitentwickeln und als Forschung anerkennen. Wenn Mathematik anderen Wissenschaften nur die Nutzung fertiger KI empfiehlt, drohe ihr Bedeutungsverlust. Sie soll eigene Methoden und Anwendungen beitragen.",en:"Help develop formal libraries, symbolic methods, experiments and new forms of interaction, and recognise this as research. If mathematics merely recommends that other sciences use ready-made AI, it risks losing relevance. It should contribute its own methods and applications."},references:[{id:5,location:"\u201EWhat is AI for mathematics?\u201C; \u201EThe challenges\u201C; \u201EThe future\u201C"}]},{label:{de:"Zhang",en:"Zhang"},body:{de:"In seinem Bericht \xFCber eine gruppentheoretische Konstruktion beschreibt Zhang, wie das Team teure Rechenwege stoppte, Koordinaten und Strategie wechselte und KI f\xFCr Programmierung und Analyse nutzte. Die Ergebnisse wurden unabh\xE4ngig mit mathematischer Software \xFCberpr\xFCft. Mehr Rechenleistung allein h\xE4tte den Strategiewechsel nicht ersetzt.",en:"In his account of a group-theoretic construction, Zhang describes how the team stopped costly computational approaches, changed coordinates and strategy, and used AI for programming and analysis. The results were independently checked with mathematical software. More computing power alone would not have replaced the change of strategy."},references:[{id:72,location:"\u201EWhen more precision was the wrong answer\u201C; \u201EWhat I learned\u201C"}]}]},"17":{title:"Welche Kompetenzen sollen Studieng\xE4nge k\xFCnftig vermitteln?",perspectives:[{label:{de:"Thom",en:"Thom"},body:{de:"Studieng\xE4nge bis zur Promotion von den Anforderungen des Arbeitsmarkts einschlie\xDFlich wissenschaftlicher Karrieren her gestalten. Probleml\xF6sung in Zusammenarbeit mit KI und die Nutzbarmachung KI-erzeugter Resultate sollen im Vordergrund stehen.",en:"Design programmes up to the doctorate around the requirements of the labour market, including academic careers. Problem-solving in collaboration with AI and making AI-generated results useful should be central."},references:[{id:64,location:"Punkt 2"}]},{label:{de:"Avigad; Commelin et al.",en:"Avigad; Commelin et al."},body:{de:"Avigad fordert beruflich relevante Probleml\xF6sung mit KI bei Erhalt mathematischer Intuition. Commelin und Mitautor:innen empfehlen, Problemformulierung, Kommunikation und kritische Pr\xFCfung von Argumenten im Curriculum zu st\xE4rken und Studierende an der Gestaltung zu beteiligen.",en:"Avigad calls for professionally relevant problem-solving with AI while preserving mathematical intuition. Commelin and co-authors recommend strengthening problem formulation, communication and critical scrutiny of arguments in the curriculum, and involving students in its design."},references:[{id:4,location:"\xA7\xA73\u20134"},{id:15,location:"S.3"}]},{label:{de:"Su",en:"Su"},body:{de:"Mathematische Bildung auch an Ausdauer, Kreativit\xE4t, Perspektivwechsel und Verantwortung ausrichten. Ihr Wert reicht \xFCber verwertbare Probleml\xF6sungen hinaus.",en:"Orient mathematical education also towards perseverance, creativity, changes of perspective and responsibility. Its value extends beyond practically useful solutions."},references:[{id:55,location:"\u201EWhat a math education is really for\u201C"}]},{label:{de:"Thom (Lehrkonzept)",en:"Thom (teaching concept)"},body:{de:"Lehr- und Pr\xFCfungsformen aus den Zielkompetenzen f\xFCr Forschung und Beruf entwickeln: pr\xE4zise Begriffsverwendung, Beweiskontrolle, Beispiele und Gegenbeispiele, Strukturerkennung und mathematische Verantwortung.",en:"Develop teaching and assessment from the target competencies for research and employment: precise use of concepts, checking proofs, examples and counterexamples, recognising structures and mathematical responsibility."},references:[{id:62,location:"S.1"}]},{label:{de:"MIT-Bericht",en:"MIT report"},body:{de:"Von Lernzielen ausgehen und danach KI erlauben, verlangen oder begrenzen. Effektiven, verantwortlichen und ethischen Einsatz in Studium und Promotion vermitteln.",en:"Start from learning goals and then permit, require or limit AI accordingly. Teach effective, responsible and ethical use in degree programmes and doctoral education."},references:[{id:42,location:"\xA7\xA72.5\u20132.7, 3.2.4"}]}]},"18":{title:"Wie k\xF6nnen Lehrformate Eigenkompetenz und verantwortliche KI-Nutzung verbinden?",perspectives:[{label:{de:"Thom (Lehrkonzept)",en:"Thom (teaching concept)"},body:{de:"Vier Elemente verzahnen: Die Vorlesung vermittelt Leitideen und Zusammenh\xE4nge; ein kursbezogener KI-Tutor unterst\xFCtzt das Selbststudium; die Grund\xFCbung trainiert eigenes mathematisches Denken in Pr\xE4senz weitgehend ohne KI; das Labor \xFCbt kontrollierten Einsatz von KI, Programmierung und weiteren Werkzeugen.",en:"Connect four elements: the lecture conveys guiding ideas and connections; a course-specific AI tutor supports self-study; the foundational exercise class trains independent mathematical thinking in person, largely without AI; the laboratory practises controlled use of AI, programming and other tools."},references:[{id:62,location:"\xA7\xA71.1\u20131.4, S.2\u20133"}]},{label:{de:"Thom (Rollen und Umfang)",en:"Thom (roles and workload)"},body:{de:"Das Skript bleibt ma\xDFgeblicher Referenztext; KI-Erkl\xE4rungen sind daran und an eigenen \xDCberlegungen zu pr\xFCfen. Beispielhafte Umverteilung: je 2 Semesterwochenstunden (SWS) Vorlesung, Grund\xFCbung und Labor statt 4 SWS Vorlesung plus 2 SWS \xDCbung; der KI-Tutor unterst\xFCtzt au\xDFerhalb der Pr\xE4senzzeit.",en:"The lecture notes remain the authoritative reference; AI explanations should be checked against them and against one\u2019s own reasoning. An illustrative redistribution is two weekly semester hours each for lecture, foundational exercise class and laboratory instead of four for lectures plus two for exercises; the AI tutor supports learning outside contact hours."},references:[{id:62,location:"\xA71 und \xA71.2, S.2"}]},{label:{de:"Thom (Studienverlauf)",en:"Thom (programme structure)"},body:{de:"Zun\xE4chst gemeinsame Grundlagen sichern, sp\xE4ter nach Studienrichtung gewichten: theoretisch etwa Beweis- und Literaturseminare sowie formale Verifikation; anwendungsbezogen Modellierung, Datenanalyse und Simulation. Eigenkompetenz bleibt in allen Pfaden n\xF6tig.",en:"First secure shared foundations, then adjust emphasis by study pathway: for theory, for example, proof and literature seminars and formal verification; for applications, modelling, data analysis and simulation. Independent competence remains necessary in every pathway."},references:[{id:62,location:"\xA72, S.3\u20134"}]},{label:{de:"Jaye und Livshyts",en:"Jaye and Livshyts"},body:{de:"Aufgaben zur Beweispr\xFCfung, zur Auswahl und Begr\xFCndung interessanter Fragen, zum verst\xE4ndlichen Schreiben und zu Kurzvortr\xE4gen erproben. Diese lassen sich verbinden: eigene Fragen gegebenenfalls mit KI bearbeiten, einen verst\xE4ndlichen Bericht schreiben und die Ergebnisse im Kurs verteidigen.",en:"Try tasks on checking proofs, selecting and justifying interesting questions, writing intelligibly and giving short talks. These can be combined: work on one\u2019s own questions, with AI where appropriate, write an understandable report and defend the results in class."},references:[{id:25,location:"nummerierte Aufgabenfolge"}]}]},"19":{title:"Wie lernen Studierende mit KI, ohne das eigene Denken auszulagern?",perspectives:[{label:{de:"Etingof",en:"Etingof"},body:{de:"Zun\xE4chst eigene Versuche unternehmen, Hinweise statt fertiger L\xF6sungen erfragen und \xDCbungsaufgaben selbst bearbeiten. KI soll Lernen verst\xE4rken.",en:"Attempt problems independently first, ask for hints rather than complete solutions and work through exercises oneself. AI should enhance learning."},references:[{id:18,location:"\xA7\xA73, 4.5"}]},{label:{de:"Karamanis",en:"Karamanis"},body:{de:"Schwierigkeiten und Fehlersuche geh\xF6ren zur Ausbildung des Urteils, das sp\xE4ter KI beaufsichtigen soll. Methoden und Entscheidungen m\xFCssen selbst erkl\xE4rbar bleiben.",en:"Difficulties and debugging are part of developing the judgement that will later supervise AI. One must remain able to explain methods and decisions oneself."},references:[{id:26,location:"Abs\xE4tze zur wissenschaftlichen Betreuung"}]},{label:{de:"Siktar",en:"Siktar"},body:{de:"Verwendete KI-Argumente sorgf\xE4ltig auf Papier durcharbeiten. Studierende sollen bei Codekorrekturen Fehlerursache, Wirkung und geeignete Tests selbst erkl\xE4ren k\xF6nnen. Gemeinsames Prompten mit der Betreuung schl\xE4gt er als von ihm selbst noch nicht erprobte Lehrmethode vor.",en:"Carefully work through any AI arguments used on paper. When correcting code, students should explain the cause of the error, the effect of the correction and suitable tests. He proposes joint prompting with supervisors as a teaching method he has not yet tried himself."},references:[{id:52,location:"\u201EBe efficient...\u201C; \u201EDon\u2019t autopilot debugging\u201C; \u201ETag-team...\u201C"}]},{label:{de:"Tao",en:"Tao"},body:{de:"L\xE4stige Rechenarbeit kann delegiert werden, sofern ihre Ergebnisse kontrolliert werden k\xF6nnen. Begriffliche Schwierigkeiten sind oft selbst Lerngegenstand; auch KI-Erkl\xE4rungen k\xF6nnen diese Lernchance nehmen. Begleitete Nutzung, eigene Fehlversuche und gemeinsames Pr\xFCfen von KI-Ausgaben vorsehen.",en:"Tedious calculation can be delegated if its results can be checked. Conceptual difficulties are often themselves the object of learning; even AI explanations can take away this learning opportunity. Provide supervised use, independent failed attempts and joint checking of AI outputs."},references:[{id:56,location:"S.19\u201325"}]},{label:{de:"Srivathsan",en:"Srivathsan"},body:{de:"Ein Tutor soll am eigenen Versuch ansetzen: Verst\xE4ndnisfragen stellen, bei Bedarf Hinweise geben, Voraussetzungen kl\xE4ren und kleine Beispiele oder einfachere Teilprobleme anbieten. Produktive Fehlversuche erhalten, statt sofort die L\xF6sung zu liefern.",en:"A tutor should build on the learner\u2019s own attempt: ask questions to test understanding, give hints as needed, clarify prerequisites and offer small examples or simpler subproblems. Preserve productive failed attempts instead of immediately supplying the solution."},references:[{id:53,location:"Haupttext"}]}]},"20":{title:"Wie pr\xFCfen wir Verst\xE4ndnis in Pr\xFCfungen, Abschlussarbeiten und Promotionen?",perspectives:[{label:{de:"MIT-Bericht",en:"MIT report"},body:{de:"F\xFCr das MIT empfiehlt der Bericht m\xFCndliche Pr\xFCfungen, Semesterportfolios und schriftliche Arbeiten mit anschlie\xDFenden Gespr\xE4chen sowie die Erprobung kompetenzbezogener Bewertung. Jede Abschlussarbeit soll eine Erkl\xE4rung zur KI-Nutzung enthalten. Auf KI-Detektoren solle man sich nicht verlassen.",en:"For MIT, the report recommends oral examinations, semester portfolios, written work followed by discussions and trials of competency-based assessment. Every thesis should include an AI-use statement. AI detectors should not be relied upon."},references:[{id:42,location:"\xA7\xA73.1.2, 3.1.6, 3.1.9, 3.2.6"}]},{label:{de:"Thom (Vorschlag f\xFCr Studienmodule)",en:"Thom (proposal for course modules)"},body:{de:"Eigenkompetenz ohne KI durch Pr\xE4senztests, m\xFCndliche Kurzpr\xFCfungen, Fehleranalysen und kleine Beweis- oder Gegenbeispielaufgaben pr\xFCfen. Werkzeugkompetenz durch dokumentierte Laborprojekte und m\xFCndliche Verteidigungen beurteilen; Annahmen, Beweisstatus und unabh\xE4ngige Kontrolle der Ergebnisse z\xE4hlen mit.",en:"Assess independent competence without AI through in-person tests, short oral examinations, error analyses and small proof or counterexample tasks. Assess tool competence through documented laboratory projects and oral defences; assumptions, proof status and independent checking of results should also count."},references:[{id:62,location:"\xA71.4, S.3; \xA73, S.4"}]},{label:{de:"Su",en:"Su"},body:{de:"Gute Fragen, begr\xFCndete Strategien und Ausdauer auch dann bewerten, wenn noch kein vollst\xE4ndiger Beweis vorliegt.",en:"Assess good questions, justified strategies and perseverance even when no complete proof is available yet."},references:[{id:55,location:"\u201EWhat this means for us\u201C"}]},{label:{de:"Etingof",en:"Etingof"},body:{de:"Als praktische Verst\xE4ndnisanforderung: Den verwendeten Gedankengang spontan und im Detail erkl\xE4ren k\xF6nnen.",en:"A practical requirement for understanding: be able to explain the reasoning used spontaneously and in detail."},references:[{id:18,location:"\xA71, S.1"}]},{label:{de:"Tao",en:"Tao"},body:{de:"Den L\xF6sungs- und Pr\xFCfprozess bewerten, bei geeigneten Aufgaben auch Prompts und unabh\xE4ngige Kontrolle verlangen. Iterative Projekte d\xFCrfen mit fehlerhaften eigenen Versuchen beginnen; kreative KI-Nutzung nur dosiert einsetzen.",en:"Assess the solution and checking process; for suitable tasks, also require prompts and independent verification. Iterative projects may begin with the student\u2019s own flawed attempts; use creative AI work only in moderation."},references:[{id:56,location:"S.24\u201326"}]},{label:{de:"Serraille",en:"Serraille"},body:{de:"Verst\xE4ndnis mit eigenen Beispielen, ungewohnten Aufgaben und Pr\xE4senzarbeit pr\xFCfen. In Bachelorund Masterarbeiten auf Sprachmodelle verzichten, allenfalls nachtr\xE4gliche Sprachkorrektur und Bildgenerierung ausnehmen: Eigenst\xE4ndiges Lesen, Scheitern und Nachfragen sind f\xFCr ihn zentrale Lernziele.",en:"Assess understanding through students\u2019 own examples, unfamiliar tasks and in-person work. Avoid language models in bachelor\u2019s and master\u2019s theses, with possible exceptions for subsequent language correction and image generation: independent reading, failure and asking questions are central learning goals for him."},references:[{id:50,location:"\xA7\xA71, 2.1\u20132.2"}]},{label:{de:"Sarkar",en:"Sarkar"},body:{de:"Sarkar berichtet aus einem Kurs zur Mathematikgeschichte: Pr\xE4senztexte mit Hausarbeiten vergleichen und im Gespr\xE4ch nach dem eigenen Gedankengang fragen; mit fremder Hilfe geschriebene Passagen in eigenen Worten erkl\xE4ren lassen. Dies dient dem Lernen und ist kein validierter KI-Detektor.",en:"Sarkar reports from a history of mathematics course: compare in-class writing with take-home essays, ask students about their own reasoning in conversation and have them explain passages written with outside help in their own words. This serves learning; it is not a validated AI detector."},references:[{id:49,location:"\u201ESuperintelligence\u201C"}]}]},"21":{title:"Welche Ressourcen braucht eine Reform der Mathematiklehre, und wie l\xE4sst sie sich realistisch einf\xFChren?",perspectives:[{label:{de:"Thom (Lehrkonzept)",en:"Thom (teaching concept)"},body:{de:"F\xFCr Thoms Modell aus Vorlesung, KI-Tutor, Grund\xFCbung und Labor zus\xE4tzliche Vorbereitung, Abstimmung und Betreuung einplanen: kleinere Arbeitsgruppen, geschulte Tutor:innen, technische Infrastruktur und Aufgaben zur mathematischen Kontrolle. Die Umverteilung der Pr\xE4senzstunden macht das Modell vermutlich nicht kostenneutral.",en:"Allow for additional preparation, coordination and supervision in Thom\u2019s model of lectures, AI tutoring, foundational exercises and laboratories: smaller working groups, trained tutors, technical infrastructure and tasks focused on mathematical checking. Redistributing contact hours probably does not make the model cost-neutral."},references:[{id:62,location:"\xA74, S.4\u20135"}]},{label:{de:"Thom (Einf\xFChrung des Lehrkonzepts)",en:"Thom (introducing the teaching concept)"},body:{de:"Stofff\xFClle, Rechenroutine und rein reproduktive Formate reduzieren, statt neue Anforderungen nur hinzuzuf\xFCgen. Einzelne Module schrittweise erproben und Betreuung sowie Pr\xFCfungsformen evaluieren. Mehr Aufwand ist nur gerechtfertigt, wenn Eigenkompetenz und verantwortliche Werkzeugnutzung sichtbar gest\xE4rkt werden.",en:"Reduce content overload, routine calculation and purely reproductive formats instead of merely adding new demands. Trial individual modules gradually and evaluate supervision and assessment. Additional effort is justified only if independent competence and responsible tool use are demonstrably strengthened."},references:[{id:62,location:"\xA74, S.5"}]}]},"22":{title:"Woran sollen Ein
