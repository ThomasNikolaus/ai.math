stellungen und wissenschaftliche Anerkennung gemessen werden?",perspectives:[{label:{de:"Thom",en:"Thom"},body:{de:"Anerkennen, wer erkl\xE4rt, warum ein Argument funktioniert, Kernideen von Technik trennt, Verbindungen und fruchtbare Fragen findet, Methoden lehrt und andere bef\xE4higt. Beitr\xE4ge erfolgen auch in Vortr\xE4gen, Gespr\xE4chen, Lehre und Zusammenarbeit, nicht nur in Artikeln.",en:"Recognise those who explain why an argument works, separate core ideas from technical details, find connections and fruitful questions, teach methods and enable others. Contributions also happen in talks, conversations, teaching and collaboration, not only in articles."},references:[{id:63,location:"Schlussteil"}]},{label:{de:"Weinreich (Vorschlag f\xFCr Zeitschriften)",en:"Weinreich (proposal for journals)"},body:{de:"Wissenschaftliche Anerkennung f\xFCr Ideen auch nach deren Ver\xF6ffentlichung mit Personen teilen, die das Argument eigenst\xE4ndig beherrschen. Zeitschriften k\xF6nnten dieses Verst\xE4ndnis durch ausf\xFChrliche Erkl\xE4rung vor einem sachkundigen, kritischen Publikum pr\xFCfen, gegebenenfalls im Umfang einer Graduiertenveranstaltung. Weinreich nennt dies \u201Eco-ownership\u201C.",en:"Share scientific credit for ideas, even after publication, with people who independently master the argument. Journals could assess this understanding through detailed explanation before a knowledgeable, critical audience, potentially on the scale of a graduate course. Weinreich calls this co-ownership."},references:[{id:70,location:"\xA72: \u201EFor journals\u201C"}]},{label:{de:"Tao; Mathematical Discourse",en:"Tao; Mathematical Discourse"},body:{de:"Erkl\xE4rung, Begutachtung und Einordnung st\xE4rker anerkennen. Das Videojournal Mathematical Discourse ist ein konkretes Beispiel: Es begutachtet Klarheit, Neuheit und mathematisches Interesse von Vortr\xE4gen. Es ersetzt die Pr\xFCfung der schriftlichen Beweise ausdr\xFCcklich nicht.",en:"Give greater recognition to explanation, reviewing and contextualisation. The video journal Mathematical Discourse is a concrete example: it reviews talks for clarity, novelty and mathematical interest. It explicitly does not replace checking the written proofs."},references:[{id:59,location:"\xA78; Anhang A"},{id:41,location:"\u201EAims and Scope\u201C; \u201EReview Process\u201C"}]},{label:{de:"Guo (Bewertungsvorschlag)",en:"Guo (evaluation proposal)"},body:{de:"Mathematischen Resultatwert und pers\xF6nlichen Beitrag trennen. Anteile, die festgelegte KI-Systeme mit festgelegtem Rechenbudget reproduzieren, vom menschlichen Beitrag abziehen, auch bei rein menschlicher Arbeit. Gescheiterte Reproduktion beweist dabei keine Originalit\xE4t. Einen empirischen Nachweis der Eignung f\xFCr Personalentscheidungen liefert der Text nicht.",en:"Separate the mathematical value of a result from the personal contribution. Deduct from the human contribution whatever specified AI systems can reproduce with a specified computing budget, even for entirely human work. Failure to reproduce does not prove originality. The text offers no empirical evidence that this is suitable for personnel decisions."},references:[{id:21,location:"\u201EA stable AI-residual evaluation system\u201C; \u201EA practical transition\u201C"}]},{label:{de:"Thom",en:"Thom"},body:{de:"Beitr\xE4ge zur Integration KI-erzeugter Resultate in die mathematische Kultur bei Einstellungen st\xE4rker gewichten; dieselbe Entkopplung von Produkt und Kompetenz betrifft Abschlussarbeiten. Wie solche Beitr\xE4ge vergleichbar gemessen werden, bleibt derzeit offen.",en:"Give greater weight in hiring to contributions that integrate AI-generated results into mathematical culture; the same decoupling of product and competence affects theses. How such contributions can be measured comparably remains open at present."},references:[{id:64,location:"Punkt 5"}]}]},"23":{title:"Wie erhalten Nachwuchsforschende sinnvolle Arbeit und Entwicklungsm\xF6glichkeiten?",perspectives:[{label:{de:"MIT-Bericht",en:"MIT report"},body:{de:"Forschungspraktika und betreute Mitarbeit ausbauen. Werden Studierende aus Effizienzgr\xFCnden durch KI-Agenten ersetzt, k\xF6nnten ihnen Lerngelegenheiten und der Zugang zu Forschungsgemeinschaften verloren gehen. Der Bericht fordert deshalb, Mentoring und pers\xF6nliche Zusammenarbeit gezielt zu erhalten.",en:"Expand research internships and supervised participation. If students are replaced by AI agents for reasons of efficiency, they may lose learning opportunities and access to research communities. The report therefore calls for deliberately preserving mentoring and personal collaboration."},references:[{id:42,location:"\xA7\xA72.3, 3.1.5"}]},{label:{de:"Duminil-Copin",en:"Duminil-Copin"},body:{de:"Offene Probleme k\xF6nnen Zusammenarbeit, Methoden und Nachwuchsausbildung tragen. Ihre schnelle Erledigung kann diese Entwicklung unterbrechen, auch bei einem kurzen und eleganten Beweis. Er erkennt den Nutzen beschleunigter L\xF6sungen in anwendungsnahen Bereichen an; eine allgemeine Grenzregel nennt er nicht.",en:"Open problems can sustain collaboration, methods and early-career training. Rapidly resolving them can interrupt this development, even with a short and elegant proof. He acknowledges the benefit of faster solutions in application-oriented fields; he gives no general boundary rule."},references:[{id:17,location:"\u201EA profound misalignment...\u201C; \u201EWhat should we do?\u201C"}]},{label:{de:"Mathathon-Organisatoren",en:"Mathathon organisers"},body:{de:"F\xFCr den geplanten KI-Mathematikwettbewerb Mathathon eine Bildungssparte mit Skripten, Erkl\xE4rvideos und eleganteren Beweisen bekannter S\xE4tze vorsehen. Erkl\xE4rung, Motivation und Methoden sollen neben Ergebnissen belohnt werden.",en:"Provide an educational track for the planned AI mathematics competition Mathathon, with notes, explanatory videos and more elegant proofs of known theorems. Explanation, motivation and methods should be rewarded alongside results."},references:[{id:2,location:"\u201EWho are we...\u201C; \u201EAgainst the Slopification...\u201C"}]},{label:{de:"Hayward",en:"Hayward"},body:{de:"Anspruchsvolle Ausbildung und Solidarit\xE4t mit Kolleg:innen erhalten, die Nutzungsdruck widerstehen. Er warnt vor einer Verlagerung von Personalbudgets zu Abonnements und einer Arbeit, die sich auf Outputkontrolle reduziert; dies sind Bef\xFCrchtungen, keine gesicherten Prognosen.",en:"Preserve demanding education and solidarity with colleagues resisting pressure to use AI. He warns of personnel budgets shifting to subscriptions and work being reduced to checking output; these are concerns, not established predictions."},references:[{id:24,location:"\u201EThe Likely Trajectory\u201C; \u201EWhy Even be Human?\u201C; \u201EAcademics and Solidarity\u201C"}]},{label:{de:"Lozano-Robledo",en:"Lozano-Robledo"},body:{de:"Gezielt in Menschen investieren und Betreuung, Vorbilder sowie begeisternde Erkl\xE4rungen w\xFCrdigen. Gemeinschaft entsteht durch Menschen, die Resultate verstehen, verbessern und anderen zug\xE4nglich machen. Eine konkrete Finanzierungsformel enth\xE4lt der Appell nicht.",en:"Invest deliberately in people and value supervision, role models and inspiring explanations. Community is built by people who understand results, improve them and make them accessible to others. The appeal contains no specific funding formula."},references:[{id:37,location:"Haupttext, Schlussabs\xE4tze"}]}]},"24":{title:"Brauchen wir \xF6ffentliche KI-Infrastruktur statt Abh\xE4ngigkeit von wenigen Firmen?",perspectives:[{label:{de:"Thom",en:"Thom"},body:{de:"Fortgeschrittene KI als gesellschaftliche Grundversorgung wie Wasser oder Strom behandeln: zuverl\xE4ssig, breit verf\xFCgbar, mit \xF6ffentlichen Pflichten, starkem Datenschutz, unabh\xE4ngiger Aufsicht und Schutz vor diskriminierender oder eigenn\xFCtziger Nutzung. Das betrifft auch Bildung, Verwaltung, Wirtschaft und Alltag.",en:"Treat advanced AI as a basic public service like water or electricity: reliable, widely available, with public obligations, strong data protection, independent oversight and safeguards against discriminatory or self-serving use. This also concerns education, public administration, the economy and everyday life."},references:[{id:63,location:"letzte zwei Abs\xE4tze"}]},{label:{de:"Leiden-Erkl\xE4rung",en:"Leiden Declaration"},body:{de:"\xD6ffentliche Recheninfrastruktur auf Hochschul-, nationaler und internationaler Ebene sowie administrativ und finanziell industrieunabh\xE4ngige Forschungslabore f\xF6rdern.",en:"Support public computing infrastructure at university, national and international levels, and research laboratories that are administratively and financially independent of industry."},references:[{id:33,location:"\u201ESupport public research laboratories\u201C; \u201EInvest in public computational infrastructure\u201C"}]},{label:{de:"Commelin et al.",en:"Commelin et al."},body:{de:"Offene akademische Infrastruktur mit transparenten Entscheidungen und Gemeinschaftskontrolle aufbauen; Abh\xE4ngigkeit von einzelnen Unternehmen vermindern.",en:"Build open academic infrastructure with transparent decision-making and community oversight; reduce dependence on individual companies."},references:[{id:15,location:"S.3"}]},{label:{de:"Klowden und Tao",en:"Klowden and Tao"},body:{de:"Gemeinschaftlich gepflegte kleinere Modelle und eine nationale oder multinationale, \xF6ffentlich finanzierte und zug\xE4ngliche KI-Ressource f\xF6rdern. Die Autoren warnen zudem: Wenn Hochschulen Forschende an einen Anbieter binden, k\xF6nnen je nach Fach unterschiedlich leistungsf\xE4hige Modelle neue Ungleichheiten schaffen.",en:"Support community-maintained smaller models and a nationally or multinationally funded, publicly accessible AI resource. The authors also warn that when universities tie researchers to one provider, differences in models\u2019 capabilities across disciplines can create new inequalities."},references:[{id:27,location:"\xA75.3"}]},{label:{de:"Thom",en:"Thom"},body:{de:"Eine nationale oder europaweite KI-Infrastruktur wie eine grundlegende Versorgung organisieren: in \xF6ffentlicher Hand oder unter starker Kontrolle. Intelligenz als allgemein verf\xFCgbare Ressource behandeln, deren Nutzung und Bereitstellung nicht missbr\xE4uchlich gestaltet werden d\xFCrfen.",en:"Organise national or Europe-wide AI infrastructure as a basic service: publicly owned or strongly regulated. Treat intelligence as a generally available resource whose use and provision must not be designed abusively."},references:[{id:64,location:"Punkt 3"}]}]},"25":{title:"Wie verhindern wir, dass finanzschwache Forschende und L\xE4nder abgeh\xE4ngt werden?",perspectives:[{label:{de:"Thom",en:"Thom"},body:{de:"Kolleg:innen in finanziell schwachen L\xE4ndern ber\xFCcksichtigen, die kommerzielle KI-Angebote nicht bezahlen k\xF6nnen. Thom verbindet diese Sorge mit der Forderung nach gleichem Zugang zu KI als \xF6ffentlicher oder streng kontrollierter Grundversorgung. Wie der internationale Zugang finanziert werden soll, ist derzeit offen.",en:"Consider colleagues in countries with limited financial resources who cannot afford commercial AI offerings. Thom connects this concern with equal access to AI as a public or strictly regulated basic service. How international access should be financed is currently an open question."},references:[{id:64,location:"Punkte 3\u20134"}]},{label:{de:"MIT-Bericht",en:"MIT report"},body:{de:"Institutionell finanzierten, anbieter\xFCbergreifenden Zugang bereitstellen und bei h\xF6herem Lehrbedarf erweitern; auch Rechenressourcen f\xFCr eigene Modelle ber\xFCcksichtigen.",en:"Provide institutionally funded access across providers and expand it where teaching needs are greater; also consider computing resources for running one\u2019s own models."},references:[{id:42,location:"\xA7\xA73.3.7\u20133.3.8"}]},{label:{de:"Mathathon-Organisatoren; offener Brief",en:"Mathathon organisers; open letter"},body:{de:"Die Organisatoren wollen mit Rechenguthaben f\xFCr ihren KI-Mathematikwettbewerb besonders jungen Forschenden besseren Zugang er\xF6ffnen. Der offene Brief bezweifelt hingegen, dass ein Forschungsmodell mit 20.000 US-Dollar Rechenguthaben pro Ergebnis allgemein finanzierbar w\xE4re.",en:"The organisers aim to use computing credits for their AI mathematics competition to improve access, particularly for young researchers. The open letter, in contrast, questions whether a research model requiring US$20,000 of computing credits per result could be broadly affordable."},references:[{id:2,location:"\u201ECare for Young Mathematicians\u201C"},{id:11,location:"Haupttext"}]},{label:{de:"Redaktionelle Einordnung",en:"Editorial context"},body:{de:"\xD6ffentliche Infrastruktur und institutioneller KI-Zugang sind Ans\xE4tze gegen finanzielle Ungleichheit. Die hier zitierten Beitr\xE4ge enthalten jedoch kein ausgearbeitetes weltweites Finanzierungs- oder Verteilungsmodell.",en:"Public infrastructure and institutional AI access are approaches to financial inequality. However, the contributions cited here contain no fully developed global funding or allocation model."},references:[{id:33,location:"\xF6ffentliche Infrastruktur"},{id:15,location:"S.3\u20134"},{id:42,location:"\xA73.3.7"}]},{label:{de:"Tao im Interview",en:"Tao in interview"},body:{de:"\xD6ffentliche und philanthropische F\xF6rderung st\xE4rker auf offene, lokal betreibbare und g\xFCnstigere Modelle sowie die \xDCbertragung leistungsf\xE4higer Verfahren auf sparsamere Modelle ausrichten. Dies ist ein Zugangsvorschlag, keine Garantie gleicher M\xF6glichkeiten.",en:"Direct more public and philanthropic support towards open, locally runnable and less expensive models, and towards transferring powerful methods to more economical models. This is an access proposal, not a guarantee of equal opportunities."},references:[{id:57,location:"Frage 3b"}]}]},"26":{title:"Wie sch\xFCtzen wir unver\xF6ffentlichte Forschung vor Nutzung durch KI-Anbieter?",perspectives:[{label:{de:"Thom",en:"Thom"},body:{de:"Bei Zusicherungen zu unver\xF6ffentlichten Forschungschats zwischen Trainingsnutzung und direktem Zugriff unterscheiden; ihre Grundlage in Einstellungen, Datens\xE4tzen und Modellst\xE4nden offenlegen. Anonymisierung beseitigt nicht den geistigen Inhalt.",en:"When assurances are made about unpublished research chats, distinguish use for training from direct access; disclose the basis of those assurances in settings, datasets and model versions. Anonymisation does not remove intellectual content."},references:[{id:63,location:"Abs\xE4tze zur Datennutzung"}]},{label:{de:"Leiden-Erkl\xE4rung",en:"Leiden Declaration"},body:{de:"Zustimmung zu Trainingsnutzung und Ausstiegsm\xF6glichkeiten in Publikationsvertr\xE4gen sichern; Autor:innenrechte st\xE4rken.",en:"Secure consent to training use and opt-out possibilities in publication contracts; strengthen authors\u2019 rights."},references:[{id:33,location:"\u201EProtect the rights of authors\u201C"}]},{label:{de:"Bereitgestellter Positionspapierentwurf",en:"Supplied position paper draft"},body:{de:"Institutionelle Zug\xE4nge standardm\xE4\xDFig auf die angeforderte Dienstleistung beschr\xE4nken; weitere Nutzung von Eingaben, Ausgaben und abgeleiteten Informationen nur mit informierter Zustimmung. Speicherung und Zugriff begrenzen und \xFCberpr\xFCfbar machen.",en:"Limit institutional access by default to the requested service; any further use of inputs, outputs and derived information should require informed consent. Limit storage and access and make them auditable."},references:[{id:8,location:"G3, S.1"}]}]},"27":{title:"Wie verhindern wir Priorit\xE4tsvorteile aus privilegiertem Zugang zu unver\xF6ffentlichter Forschung?",perspectives:[{label:{de:"Bereitgestellter Positionspapierentwurf",en:"Supplied position paper draft"},body:{de:"Technische, organisatorische und vertragliche Informationsbarrieren verlangen. Nicht\xF6ffentliche Forschungsinformationen m\xFCssen von eigenen Forschungs- und Verwertungsaktivit\xE4ten des Anbieters oder der Institution getrennt sein; Zugriffe und Datenfl\xFCsse sollen unabh\xE4ngig \xFCberpr\xFCfbar bleiben.",en:"Require technical, organisational and contractual information barriers. Non-public research information must be separated from providers\u2019 or institutions\u2019 own research and commercialisation activities; access and data flows should remain independently auditable."},references:[{id:8,location:"G4, S.2"}]},{label:{de:"Redaktionelle Einordnung",en:"Editorial context"},body:{de:"Die im Entwurf geforderte Trennung vertraulicher Forschungsdaten von eigenen Forschungsaktivit\xE4ten der Anbieter ist eine institutionelle Schutzregel. Sie belegt weder einen konkreten Missbrauch noch die bereits wirksame Umsetzung solcher Informationsbarrieren.",en:"The draft\u2019s required separation of confidential research data from providers\u2019 own research activities is an institutional safeguard. It proves neither a specific instance of misuse nor that such information barriers are already effective in practice."},references:[{id:8,location:"G3\u20134"}]},{label:{de:"Thom",en:"Thom"},body:{de:"KI-Anbieter d\xFCrfen den Wissensvorsprung \xFCber die Nutzung fremder Ideen nicht gegen die Personen einsetzen, die ihnen diese Ideen anvertraut haben.",en:"AI providers must not use their informational advantage about the use of others\u2019 ideas against the people who entrusted those ideas to them."},references:[{id:63,location:"letzter Absatz"}]}]},"28":{title:"Wie gehen wir mit entschiedener KI-Ablehnung innerhalb der Mathematik um?",perspectives:[{label:{de:"Hairer; Leiden-Erkl\xE4rung",en:"Hairer; Leiden Declaration"},body:{de:"Redliche Gr\xFCnde f\xFCr Nutzung und Verzicht anerkennen. Die Entscheidung, ob und welche Werkzeuge eingesetzt werden, bleibt eine verantwortliche Wahl.",en:"Recognise sincere reasons for using or abstaining from AI. Whether to use tools, and which ones, remains a responsible choice."},references:[{id:22,location:"\u201EConclusion and disclaimer\u201C"},{id:33,location:"Pr\xE4ambel"}]},{label:{de:"Lazi\u0107",en:"Lazi\u0107"},body:{de:"F\xFCr die eigene Forschung auf KI verzichten. Keine maschinenverfassten Artikel begutachten und nicht bei Zeitschriften einreichen, die maschinelle Gutachten zulassen. Keine Betreuung von Promovierenden oder Postdocs und keine Unterst\xFCtzung bei Einstellungen, wenn KI die eigene Arbeit ersetzt.",en:"Abstain from AI in one\u2019s own research. Do not review machine-written articles or submit to journals that permit machine-generated reviews. Do not supervise doctoral students or postdocs, or support hiring, when AI replaces their own work."},references:[{id:30,location:"Grunds\xE4tze 1, 2 und 4"}]},{label:{de:"Weinreich",en:"Weinreich"},body:{de:"Verzicht institutionell sch\xFCtzen: daf\xFCr reservierte Stellen und st\xE4rkere Anerkennung KI-freier Arbeit bei Bef\xF6rderungen vorsehen.",en:"Protect abstention institutionally through reserved positions and greater recognition of AI-free work in promotions."},references:[{id:70,location:"\xA72: \u201EFor departments\u201C"}]},{label:{de:"Karamanis (zur wissenschaftlichen Ausbildung)",en:"Karamanis (on research training)"},body:{de:"Am Beispiel der Astrophysik pauschale KI-Verbote und unbeschr\xE4nkte Delegation gleicherma\xDFen zur\xFCckweisen. Ausbildung soll selbstst\xE4ndiges Denken und die F\xE4higkeit aufbauen, wissenschaftliche Arbeit kompetent zu betreuen und zu kontrollieren.",en:"Using astrophysics as an example, reject both blanket AI bans and unrestricted delegation. Education should develop independent thinking and the ability to supervise and check scientific work competently."},references:[{id:26,location:"Schlussteil"}]},{label:{de:"Tao im Interview",en:"Tao in interview"},body:{de:"Die Debatte breit \xF6ffnen, besonders f\xFCr die j\xFCngere Generation. Regeln f\xFCr verst\xE4ndliche mathematische Darstellung gemeinsam entwickeln und alternative Bewertungsrahmen zulassen; einzelne prominente Stimmen sollen nicht f\xFCr das ganze Fach sprechen.",en:"Open up the debate broadly, especially to the younger generation. Develop shared rules for intelligible mathematical exposition and allow alternative evaluation frameworks; individual prominent voices should not speak for the whole field."},references:[{id:57,location:"Fragen 1 und 6"}]},{label:{de:"Wildon",en:"Wildon"},body:{de:"KI f\xFCr Zusammenarbeit und Lernen einsetzen; vielf\xE4ltige Beitr\xE4ge und gute Lehre w\xFCrdigen. Nachwuchsforschende d\xFCrfen auf KI verzichten. Eigene Abh\xE4ngigkeit beobachten, Vorarbeiten w\xFCrdigen und Forschende mit verwandten Projekten fr\xFChzeitig informieren. Wildon formuliert diese Empfehlungen unter der Annahme, dass aktuelle KI-F\xE4higkeiten nahe einem vorl\xE4ufigen Plateau liegen.",en:"Use AI for collaboration and learning; value varied contributions and good teaching. Early-career researchers may abstain from AI. Monitor one\u2019s own dependence, acknowledge prior work and inform researchers with related projects early. Wildon makes these recommendations on the assumption that current AI capabilities are close to a temporary plateau."},references:[{id:71,location:"\u201EAdvice\u201C; \u201EWhere will it end?\u201C"}]},{label:{de:"Thom",en:"Thom"},body:{de:"Thom h\xE4lt die entschiedene KI-Ablehnung Einzelner oder ganzer Gruppen inhaltlich f\xFCr aussichtslos, h\xE4lt aber anhaltende Konflikte f\xFCr m\xF6glich. Der Umgang damit ist derzeit offen.",en:"Thom considers firm opposition to AI by individuals or whole groups substantively futile, but regards continuing conflicts as possible. How to address them is currently an open question."},references:[{id:64,location:"Punkt 6"}]}]},"29":{title:"Unter welchen Bedingungen sollte die Gemeinschaft mit KI-Firmen zusammenarbeiten?",perspectives:[{label:{de:"Mathathon-Brief",en:"Mathathon letter"},body:{de:"Den geplanten KI-Mathematikwettbewerb Mathathon aussetzen beziehungsweise aufgeben. Der Brief bef\xFCrchtet kommerzielle Vereinnahmung, \xFCbereilte und unzureichend verstandene Resultate sowie auf andere abgew\xE4lzte Pr\xFCfarbeit. Seine Kritik bezieht sich auf die Ank\xFCndigung vor der Antwort der Organisatoren.",en:"Pause or abandon the planned AI mathematics competition Mathathon. The letter fears commercial appropriation, rushed and inadequately understood results, and review work shifted onto others. Its criticism addresses the announcement before the organisers\u2019 response."},references:[{id:11,location:"Haupttext"}]},{label:{de:"Mathathon-Organisatoren",en:"Mathathon organisers"},body:{de:"Mathathon als ver\xE4ndertes Experiment fortf\xFChren. F\xFCr ausgew\xE4hlte Teams planen die Organisatoren eine sechsmonatige zweite Runde mit arXiv-Preprint, Video und automatisierter Formalisierung. Skeptische Stimmen sollen einbezogen werden; die Organisatoren versprechen keine durchg\xE4ngig ausreichende Qualit\xE4t.",en:"Continue Mathathon as a modified experiment. For selected teams, the organisers plan a six-month second round with an arXiv preprint, video and automated formalisation. Sceptical voices should be included; the organisers do not promise consistently sufficient quality."},references:[{id:2,location:"\u201EWho are we...\u201C; \u201EReceiving Feedback\u201C"}]},{label:{de:"First Proof",en:"First Proof"},body:{de:"First Proof verbindet die Bewertung mathematischer KI-Leistungen mit getrennter wissenschaftlicher Aufsicht und Stiftungsleitung. Laut eigener Ethikerkl\xE4rung d\xFCrfen Gremienmitglieder w\xE4hrend ihrer Amtszeit keine bezahlten KI-Firment\xE4tigkeiten \xFCbernehmen; Finanzen einschlie\xDFlich Unternehmensgeldern werden j\xE4hrlich offengelegt.",en:"First Proof combines evaluation of mathematical AI performance with separate scientific oversight and foundation governance. According to its ethics statement, governing-body members may not take paid roles at AI companies during their terms; finances, including corporate funding, are disclosed annually."},references:[{id:19,location:"Ethics Statement"}]},{label:{de:"Tao, September-Stellungnahme",en:"Tao, September statement"},body:{de:"Verantwortliche Zusammenarbeit bleibt sein Ziel. Er beschreibt jedoch eine zunehmende Abweichung zwischen Unternehmenszielen und mathematischer Kultur und fordert die Gemeinschaft auf, nicht nachhaltige Nutzungen zur\xFCckzuweisen. Seine Kontakte und beg\xFCnstigten Zug\xE4nge legt er offen; r\xFCckblickend h\xE4tte er der werblichen Verk\xFCrzung eines OpenAI-Interviews st\xE4rker widersprechen sollen.",en:"Responsible collaboration remains his goal. However, he describes growing divergence between corporate goals and mathematical culture and calls on the community to reject unsustainable uses. He discloses his contacts and preferential access; in retrospect, he should have objected more strongly to the promotional abridgement of an OpenAI interview."},references:[{id:60,location:"Kommentar vom 09.09.2026"}]},{label:{de:"Livshyts",en:"Livshyts"},body:{de:"Den Mathathon als einmaligen KI-Mathematikwettbewerb mit Zugang zu gro\xDFer Rechenleistung zulassen. Teilnahme verpflichtet f\xFCr Livshyts nicht dazu, konventionelle Forschung aufzugeben. Ihr Nachtrag betont, dass die Veranstaltung traditionelle Forschung nicht ersetzt; daraus folgt f\xFCr sie aber kein Grund, den einzelnen Versuch abzulehnen.",en:"Allow Mathathon as a one-off AI mathematics competition with access to substantial computing power. For Livshyts, participation does not commit anyone to abandoning conventional research. Her addendum stresses that the event does not replace traditional research, but she does not consider that a reason to reject the individual experiment."},references:[{id:35,location:"Schlussabsatz; Nachtrag vom 12.09.2026"}]}]},"30":{title:"Wie ber\xFCcksichtigen wir gesellschaftliche und \xF6kologische Folgen und organisieren gemeinsames Handeln?",perspectives:[{label:{de:"Leiden-Erkl\xE4rung",en:"Leiden Declaration"},body:{de:"St\xE4rkere \xF6ffentliche Aufsicht verlangen; sch\xE4dliche Kooperationen verlassen und kleinere, sparsamere oder offene Werkzeuge erw\xE4gen. Fachorganisationen sollen gemeinsame Regeln entwickeln.",en:"Demand stronger public oversight; leave harmful collaborations and consider smaller, more economical or open tools. Professional organisations should develop shared rules."},references:[{id:33,location:"Empfehlungen an Individuen, Organisationen und Politik"}]},{label:{de:"MIT-Bericht",en:"MIT report"},body:{de:"Finanzielle und \xF6kologische Nutzungskosten sichtbar machen, den eigenen Fu\xDFabdruck pr\xFCfen und sparsamere Verfahren f\xF6rdern; ein dauerhaftes Gremium soll Erfahrungen auswerten.",en:"Make financial and environmental usage costs visible, examine one\u2019s own footprint and encourage more economical methods; a standing body should evaluate experience."},references:[{id:42,location:"\xA7\xA73.3.1, 3.3.10"}]},{label:{de:"Association for Human Mathematics",en:"Association for Human Mathematics"},body:{de:"Arbeitsgruppen f\xFCr Bildungs- und Publikationspolitik organisieren und gemeinsam auf institutionelle Unabh\xE4ngigkeit von Firmeninteressen hinwirken.",en:"Organise working groups on education and publication policy and work collectively towards institutional independence from corporate interests."},references:[{id:3,location:"Arbeitsprogramm"}]},{label:{de:"Klowden und Tao",en:"Klowden and Tao"},body:{de:"Soziale Verdr\xE4ngung, ungleiche Chancen sowie Energie- und Wasserverbrauch in die Nutzenbewertung einbeziehen. Konzentrierter Gewinn rechtfertigt nicht beliebige Sch\xE4den f\xFCr andere.",en:"Include social displacement, unequal opportunities, and energy and water consumption in benefit assessments. Concentrated gains do not justify unlimited harm to others."},references:[{id:27,location:"\xA7\xA75.1\u20135.4"}]},{label:{de:"Lebovici",en:"Lebovici"},body:{de:"Insbesondere Forschende mit festen Stellen sollen Zeit und Expertise auf gesellschaftliche und \xF6kologische Aufgaben richten. Er lehnt zus\xE4tzliche generative KI-Nutzung und die Bereitstellung von Unternehmensbenchmarks aus diesen Gr\xFCnden ab.",en:"Researchers with permanent positions in particular should devote time and expertise to social and ecological tasks. On these grounds, he rejects additional use of generative AI and the provision of company benchmarks."},references:[{id:31,location:"\u201EMain result\u201C; \u201EConclusion\u201C"}]},{label:{de:"Marchand",en:"Marchand"},body:{de:"Ressourcen- und Klimafolgen gemeinsam diskutieren, LLMs \xF6ffentlich erkl\xE4ren und deren Vermarktung nicht unterst\xFCtzen. Solange die gegenw\xE4rtige, aus seiner Sicht sch\xE4dliche Entwicklungsphilosophie fortbesteht, verzichtet Marchand auf LLM-Nutzung, entsprechende Zusammenarbeit und Begutachtung. Er verlangt nicht, dass alle seine pers\xF6nliche Regel \xFCbernehmen.",en:"Discuss resource and climate impacts collectively, explain LLMs publicly and do not support their marketing. While the current development philosophy, which he regards as harmful, continues, Marchand abstains from LLM use, related collaboration and reviewing. He does not require everyone to adopt his personal rule."},references:[{id:40,location:"\u201EActing as a community...\u201C; \u201EActing as individual...\u201C"}]}]}},sources:{"1":{id:1,citation:{de:"Mohammed Abouzaid, Nikhil Srivastava, Rachel Ward und Lauren Williams. First Proof Second Batch. 10.06.2026.",en:"Mohammed Abouzaid, Nikhil Srivastava, Rachel Ward and Lauren Williams. First Proof Second Batch. 10.06.2026."},urls:["https://1stproof.org/assets/docs/report.pdf"],kind:"public"},"2":{id:2,citation:{de:"Arulandu, Rodrothu, Moreno-Earle, Garg und Zhao. A response from Mathathon. 10.09.2026.",en:"Arulandu, Rodrothu, Moreno-Earle, Garg and Zhao. A response from Mathathon. 10.09.2026."},urls:["https://proofsandprompts.com/2026/09/10/a-response-from-mathathon/"],kind:"public"},"3":{id:3,citation:{de:"Association for Human Mathematics. Selbstverst\xE4ndnis und Arbeitsprogramm. Abruf 12.09.2026.",en:"Association for Human Mathematics. Selbstverst\xE4ndnis and Arbeitsprogramm. accessed 12.09.2026."},urls:["https://www.ahmath.org/"],kind:"public"},"4":{id:4,citation:{de:"Jeremy Avigad. Mathematicians in the Age of AI. M\xE4rz 2026; Fassung 06.04.2026.",en:"Jeremy Avigad. Mathematicians in the Age of AI. March 2026; version 06.04.2026."},urls:["https://arxiv.org/html/2603.03684v3"],kind:"public"},"5":{id:5,citation:{de:"Jeremy Avigad. What is mathematics now, and what should it be? 07.09.2026.",en:"Jeremy Avigad. What is mathematics now, and what should it be? 07.09.2026."},urls:["https://proofsandprompts.com/2026/09/07/what-is-mathematics-now-and-what-should-it-be/"],kind:"public"},"6":{id:6,citation:{de:"Scholze et al. A Severe Misalignment of AI in Mathematics. ohne Datum; Abruf 12.09.2026.",en:"Scholze et al. A Severe Misalignment of AI in Mathematics. undated; accessed 12.09.2026."},urls:["https://mathandai.org/"],kind:"public"},"7":{id:7,citation:{de:"Boaz Barak. Math after AI. 24.08.2026.",en:"Boaz Barak. Math after AI. 24.08.2026."},urls:["https://windowsontheory.org/2026/08/24/math-after-ai/"],kind:"public"},"8":{id:8,citation:{de:"Bereitgestellter Grundsatzentwurf. KI in der mathematischen Forschung. ohne Datum; 3 Seiten.",en:"Supplied position paper draft. AI in Mathematical Research. Undated; 3 pages."},urls:[],kind:"internal"},"9":{id:9,citation:{de:"David Bessis. The fall of the theorem economy. 21.04.2026.",en:"David Bessis. The fall of the theorem economy. 21.04.2026."},urls:["https://davidbessis.substack.com/p/the-fall-of-the-theorem-economy"],kind:"public"},"10":{id:10,citation:{de:"Axel Boldt. Explanations, Prompts, and Formalizations: Arguments for New Norms in LLM-Enabled Mathematical Research. August 2026.",en:"Axel Boldt. Explanations, Prompts, and Formalization window.localStorage.getItem(Gb)}catch{}let t=typeof navigator<"u"?navigator.languages?.[0]||navigator.language:"en";return pI(e,a,t)}function _b(e){if(!(e!=="de"&&e!=="en"))try{window.localStorage.setItem(Gb,e)}catch{}}var Kb={de:{title:"KI im Mathematikstudium",preamble:["Mathematische Ausbildung soll Verst\xE4ndnis und die F\xE4higkeit zur eigenst\xE4ndigen und gemeinsamen Probleml\xF6sung entwickeln. Die Verf\xFCgbarkeit von KI ver\xE4ndert die Voraussetzungen daf\xFCr vom Studienbeginn bis zur Promotion. Wir m\xFCssen kl\xE4ren, welche F\xE4higkeiten k\xFCnftig ben\xF6tigt werden und wie sie erworben und nachgewiesen werden k\xF6nnen. Dieses Papier formuliert daf\xFCr Grunds\xE4tze als Grundlage gemeinsamer Diskussion und Erprobung.","Wir verstehen dieses Positionspapier als einen Entwurf, der zur Diskussion \xFCber dieses komplexe Thema anregen soll und behalten uns vor, Positionen im Laufe der Diskussion und Erprobung in der Praxis substantiell anzupassen."],principles:[["Pers\xF6nliche Entwicklung ist ein eigenst\xE4ndiges Bildungsziel.","Mathematische Bildung soll pers\xF6nliche Entwicklung, Vorstellungskraft, selbstbestimmtes Handeln und gesellschaftliche Urteilskraft f\xF6rdern. Sie hilft Menschen, eigene Ziele zu entwickeln, sich als Teil einer Gemeinschaft zu verstehen und die Folgen ihres Handelns zu beurteilen. Die pers\xF6nliche Entwicklung hat einen eigenst\xE4ndigen Wert und muss die Gestaltung des Studiums mitbestimmen."],["Die angestrebte Qualifikation bestimmt die Studienziele.","Ausgangspunkt sind die T\xE4tigkeiten in Gesellschaft und Forschung, zu denen das Studium bef\xE4higen soll. Dazu geh\xF6rt verantwortliche Probleml\xF6sung mit KI: Probleme pr\xE4zisieren, Werkzeuge ausw\xE4hlen und Ergebnisse pr\xFCfen, einordnen und nutzbar machen. Hierf\xFCr m\xFCssen die nicht delegierbaren Kompetenzen bestimmt werden. Begriffsverst\xE4ndnis, die Beurteilung von Argumenten und der Umgang mit Beispielen und Gegenbeispielen sind Ausgangspunkte f\xFCr ein noch zu entwickelndes Kompetenzprofil. Der erforderliche Umfang h\xE4ngt von Studienrichtung und Qualifikationsstufe ab. Ein wichtiges Ziel der Promotion ist die Entwicklung der F\xE4higkeit, den Erfolg von Forschungsans\xE4tzen einsch\xE4tzen zu k\xF6nnen."],["Kommunikation der eigenen F\xE4higkeiten und Ergebnisse ist zentral","Die mathematische Ausbildung soll Studierende und Promovierende bef\xE4higen, L\xF6sungen und Ergebnisse zu kommunizieren. Schreiben, Vortragen und Erkl\xE4ren geh\xF6ren zu den Kernkompetenzen. KI-Nutzung in diesem Prozess ist transparent offenzulegen."],["Die Ausbildung muss zur kritischen Beurteilung von KI bef\xE4higen.","Zum verantwortlichen Umgang mit KI geh\xF6rt die Auseinandersetzung mit Verzerrungen, der Herkunft von Trainingsdaten, Fragen geistigen Eigentums sowie sozialen und \xF6kologischen Folgen. Studierende sollen diese Bedingungen beurteilen und begr\xFCndete Entscheidungen \xFCber den Einsatz von KI treffen k\xF6nnen. Unterschiedliche, auch ablehnende Haltungen sind dabei ernst zu nehmen."],["Lernwege m\xFCssen den Aufbau eigener F\xE4higkeiten sichern.","Dass eine T\xE4tigkeit sp\xE4ter an eine KI delegiert werden kann, entscheidet noch nicht dar\xFCber, ob ihre eigene Aus\xFCbung f\xFCr das Lernen erforderlich ist. Zugleich kann KI auch beim Erwerb nicht delegierbarer Kompetenzen helfen, etwa durch Erkl\xE4rungen, R\xFCckfragen und R\xFCckmeldung. Ma\xDFgeblich ist, ob dadurch eigenes Verst\xE4ndnis und selbstst\xE4ndige Urteilskraft entstehen. Gerade eine Promotion ist ein Lern- und Entwicklungsprozess, in dem eigenst\xE4ndiges Fragen, Scheitern und Urteilsbildung zentral bleiben."],["Menschliche Beziehungen und gemeinsames Arbeiten bleiben ein zentraler Bestandteil der Ausbildung.","Pers\xF6nliche Ermutigung, fachliche Vorbilder und Zugeh\xF6rigkeit sind wichtige Grundlagen studentischer Motivation. Gemeinsame Problemarbeit schult zugleich das Erkl\xE4ren und Zuh\xF6ren, den Umgang mit Kritik und die \xDCbernahme geteilter Verantwortung. F\xFCr beides braucht das Studium verl\xE4ssliche Begegnungen mit Lehrenden und Mitstudierenden."],["Pr\xFCfungen m\xFCssen pers\xF6nliche Kompetenz und verantwortete Werkzeugnutzung sichtbar machen.","Korrekte Ergebnisse belegen unter KI-Bedingungen weder automatisch Verst\xE4ndnis noch individuelle Beitr\xE4ge. Pr\xFCfungen m\xFCssen daher transparent machen, was Studierende selbst beherrschen und was sie mit Werkzeugen leisten k\xF6nnen. Dies gilt auch f\xFCr Abschlussarbeiten und Promotionen; die Promotion muss die Bef\xE4higung zu eigenst\xE4ndiger Forschung nachweisen. Die Verantwortung f\xFCr Ergebnisse bleibt beim Menschen."],["Faire Bedingungen und nachvollziehbare Regeln sind institutionell zu sichern.","Lernzielbezogene Regeln und die Offenlegung relevanter KI-Nutzung m\xFCssen f\xFCr Studierende wie Lehrende gelten. Geforderte Werkzeuge m\xFCssen unabh\xE4ngig von privaten Mitteln und barrierearm zug\xE4nglich sein. Lern- und Forschungsdaten sind zu sch\xFCtzen; Bewertungen und Entscheidungen m\xFCssen nachvollziehbar sein."],["Die Reform muss gemeinsam erprobt und weiterentwickelt werden.","Studierende, Promovierende und Lehrende m\xFCssen die Reform gemeinsam gestalten und aufgrund neuer Erfahrungen \xFCberpr\xFCfen. Neue Lernformen brauchen Zeit, qualifizierte Betreuung und Fortbildung. Ihr Aufwand ist mit dem gesamten Curriculum abzustimmen; neue Anforderungen d\xFCrfen nicht einfach auf das bestehende Pensum aufgeschlagen werden."]]},en:{title:"AI in Mathematics Degree Programmes",preamble:["Mathematical education should develop understanding and the ability to solve problems independently and collaboratively. The availability of AI changes the conditions for this from the start of university studies through to the doctorate. We must clarify which abilities will be needed and how they can be acquired and demonstrated. This paper sets out principles as a basis for shared discussion and experimentation.","We regard this position paper as a draft intended to encourage discussion of this complex topic, and reserve the right to substantially revise our positions as discussion and practical experimentation proceed."],principles:[["Personal development is an educational goal in its own right.","Mathematical education should foster personal development, imagination, self-determined action and judgement on societal matters. It helps people develop their own goals, see themselves as part of a community and assess the consequences of their actions. Personal development has value in its own right and must help shape degree programmes."],["The intended qualification determines the learning objectives.","The starting point is the work in society and research for which a degree programme should prepare students. This includes responsible problem-solving with AI: refining problems, selecting tools, and checking, interpreting and making use of results. The competencies that cannot be delegated must be identified. Conceptual understanding, evaluating arguments, and working with examples and counterexamples are starting points for a competency profile that remains to be developed. The required scope depends on the field of study and level of qualification. An important aim of doctoral study is to develop the ability to assess the prospects of success of research approaches."],["Communicating one\u2019s own abilities and results is central","Mathematical education should enable students and doctoral researchers to communicate solutions and results. Writing, presenting and explaining are core competencies. AI use in this process must be transparently disclosed."],["Education must enable critical assessment of AI.","Responsible engagement with AI includes examining biases, the provenance of training data, questions of intellectual property, and social and ecological consequences. Students should be able to assess these conditions and make reasoned decisions about the use of AI. Different positions, including rejection of AI, must be taken seriously."],["Learning pathways must ensure the development of students\u2019 own abilities.","The fact that an activity can later be delegated to AI does not determine whether practising it oneself is necessary for learning. At the same time, AI can help students acquire competencies that cannot be delegated, for example through explanations, follow-up questions and feedback. What matters is whether this develops their own understanding and independent judgement. Doctoral study in particular is a process of learning and development in which independent questioning, failure and the formation of judgement remain central."],["Human relationships and collaborative work remain a central part of education.","Personal encouragement, academic role models and a sense of belonging are important foundations of student motivation. Working together on problems also develops the ability to explain and listen, engage with criticism and take shared responsibility. Both require reliable opportunities to interact with teachers and fellow students throughout a degree programme."],["Assessment must make personal competence and responsible tool use visible.","When AI is available, correct results do not automatically demonstrate either understanding or individual contributions. Assessments must therefore make clear what students can do themselves and what they can achieve with tools. This also applies to final theses and doctorates; a doctorate must demonstrate the ability to conduct independent research. Responsibility for results remains with humans."],["Institutions must ensure fair conditions and clear rules.","Rules tied to learning objectives and disclosure of relevant AI use must apply to students and teachers alike. Required tools must be accessible irrespective of personal financial resources and with as few accessibility barriers as possible. Learning and research data must be protected; assessments and decisions must be transparent and understandable."],["Reform must be tried out and developed collaboratively.","Students, doctoral researchers and teachers must shape reform together and review it in light of new experiences. New forms of learning require time, qualified supervision and professional development. Their demands must be coordinated with the curriculum as a whole; new requirements must not simply be added to the existing workload."]]}};var m=B(ba(),1),Il={en:"AI and Mathematics",de:"KI und Mathematik"},gI=oc.questions,bI=oc.sources,LI=["teaching","home","resources","papers","questions","experiences"],Fo=[{name:"Andreas Thom",homepage:"https://andreasthom.github.io"},{name:"Claudia Alfes",homepage:"https://www.claudia-alfes.de/"},{name:"Thomas Nikolaus",homepage:"https://www.uni-muenster.de/FB10/u/nikolaus"}];Fo.sort((e,a)=>["Claudia Alfes","Thomas Nikolaus","Andreas Thom"].indexOf(e.name)-["Claudia Alfes","Thomas Nikolaus","Andreas Thom"].indexOf(a.name));var na=(e,a,t="",n="")=>`#/${e}/${a}${t?"/"+t:""}${n?"/"+n:""}`,xI=yl.flatMap(e=>e.questions),ic=e=>String.fromCharCode(65+yl.findIndex(a=>a.id===e)),vI=e=>{let a=yl.find(t=>t.questions.some(n=>n.id===e));return a?ic(a.id)+(a.questions.findIndex(t=>t.id===e)+1):String(e)};function rc({kind:e,lang:a,question:t}){let[n,l]=(0,gn.useState)(!1),o=a==="de",i=Nb[e],r=i?.padletId,s=!!r&&/^[a-zA-Z0-9_-]+$/.test(r),u=xI.find(L=>String(L.id)===t),f=e==="papers"||e==="teaching"?o?"Das Positionspapier diskutieren":"Discuss the position paper":e==="questions"?o?"Fragen gemeinsam weiterdenken":"Take the questions further":o?"Raum f\xFCr eure Erfahrungen":"A space for your experiences";return(0,m.jsxs)("section",{className:"board-section",id:"board",children:[(0,m.jsx)("div",{className:"board-heading",children:(0,m.jsx)("h2",{children:e==="experiences"?o?"Wie geht es dir damit?":"How are you feeling about it?":o?"Zum Positionspapier diskutieren":"Discuss the position paper"})}),(0,m.jsx)("p",{className:"board-intro",children:e==="experiences"?o?"Hoffnungen, mathematics as a science, but especially about our own future as people who do mathematics. An undergraduate student asks different questions from a doctoral researcher close to finishing. A professor with a permanent position argues from a more privileged position than an assistant professor without a tenure track."}),(0,m.jsx)("p",{children:a?"Wir setzen auf eine Diskussion auf Augenh\xF6he. Lasst uns reflektiert und mit Empathie diskutieren! Ein Postdoc in der Bewerbungsphase versp\xFCrt mehr Druck, KI einzusetzen, um schneller zu arbeiten, als ein Professor mit einer gesicherten Dauerstelle. Frisch gebackene Eltern haben nach zahlreichen schlaflosen N\xE4chten andere Voraussetzungen, sich in eine Aussage aus einem anderen Gebiet einzuarbeiten, die sie in ihrem Paper verwenden, als eine Professorin mit viel Zeit und Schlaf. Menschen reagieren unterschiedlich auf neue Entwicklungen: Einige sind skeptisch und vorsichtig, andere neugierig und gespannt. Gepr\xE4gt durch unsere Pers\xF6nlichkeiten und Erfahrungen gehen wir unterschiedlich mit Unsicherheit um. Gerade wenn wir \xFCber den generellen Einsatz von KI oder unsere Erwartungen an das Verst\xE4ndnis von Resultaten diskutieren, sollten wir daher viel Verst\xE4ndnis f\xFCr die Lebensumst\xE4nde unserer Diskussionspartner:innen aufbringen.":"We seek a discussion on equal terms. Let us discuss thoughtfully and with empathy! A postdoc applying for jobs feels more pressure to use AI to work faster than a professor with a secure permanent position. After many sleepless nights, new parents face different conditions when working to understand a statement from another field that they use in their paper than a professor with plenty of time and sleep. People react differently to new developments: some are sceptical and cautious, others curious and excited. Different people deal with uncertainty differently, shaped by our personalities and experiences. Especially when discussing whether to use AI in general or what understanding of results we expect, we should therefore show considerable understanding for our discussion partners\u2019 circumstances."}),(0,m.jsx)("p",{children:a?"Wir laden dazu ein, Erfahrungen, Hoffnungen und Sorgen im offenen Board zu teilen und die Positionspapiere zu Forschung und Lehre in den jeweiligen Boards zu diskutieren.":"We invite you to share experiences, hopes and concerns on the open board and to discuss the position papers on research and education on their respective boards."}),(0,m.jsxs)("p",{children:[a?"Der Austausch kann ebenso in Fachbereichen, Arbeitsgruppen und informellen Gespr\xE4chen stattfinden. Das Online-Seminar ":"These exchanges can also take place within departments, research groups and informal conversations. The online seminar ",(0,m.jsx)("a",{href:Zr,target:"_blank",rel:"noopener noreferrer",children:"AI and the Future of Mathematics"}),a?" bietet mit Vortr\xE4gen und anschlie\xDFenden Diskussionen weitere Anl\xE4sse daf\xFCr. Lokale Treffen k\xF6nnen diese Gespr\xE4che aufgreifen und fortsetzen. Wir laden dazu ein, solche Treffpunkte zu organisieren!":" offers further opportunities through talks and follow-up discussions. Local meetings can build on and continue these conversations. We invite you to organise such meeting points!"]})]}),(0,m.jsxs)("div",{className:"discussion-board-links prose",children:[(0,m.jsx)("p",{children:(0,m.jsxs)("a",{href:"https://padlet.com/andreasbthom/mathe-und-ki-forschung-s023jvaws0orn8tvtidh",target:"_blank",rel:"noopener noreferrer",children:[a?"Forschung diskutieren":"Discuss research"," \u2197"]})}),(0,m.jsx)("p",{children:(0,m.jsxs)("a",{href:"https://padlet.com/andreasbthom/mathe-und-ki-lehre-s023jvbpjr1n139eny8v",target:"_blank",rel:"noopener noreferrer",children:[a?"Lehre diskutieren":"Discuss education"," \u2197"]})})]}),(0,m.jsx)(rc,{kind:"experiences",lang:e})]})}var Zr="https://www.uni-muenster.de/MathematicsMuenster/ai-math/",CI={de:["Wir wenden uns an die mathematische Gemeinschaft in einer Zeit gro\xDFer Ungewissheit. Die Entwicklung k\xFCnstlicher Intelligenz ber\xFChrt unser Verst\xE4ndnis von Mathematik, unsere Praxis in Forschung und Lehre und die beruflichen Perspektiven von Mathematiker:innen. Sie er\xF6ffnet neue M\xF6glichkeiten f\xFCr mathematisches Entdecken, Verstehen und gemeinsames Forschen und bringt zugleich Risiken mit sich. Ihr weiterer Verlauf und ihre Folgen sind nur begrenzt absehbar, umso weniger, je weiter wir in die Zukunft blicken. Wir nehmen die Sorgen ernst, die diese Entwicklung bei vielen im Hinblick auf ihre berufliche Zukunft und die Bedeutung ihrer Arbeit ausl\xF6st. Zugleich sehen wir die Verantwortung, die aus unserer Stellung in der Wissenschaft erw\xE4chst, und m\xF6chten die Entwicklung in einem offenen, gemeinsamen Verst\xE4ndigungsprozess mitgestalten.","Wir sehen die aktuellen Chancen, Probleme und Herausforderungen innerhalb der Mathematik zugleich als Vorboten \xE4hnlicher und m\xF6glicherweise noch weitreichenderer Entwicklungen in anderen Bereichen der Gesellschaft. Sie werfen Fragen auf, die \xFCber unser Fach hinausreichen: nach dem Wert menschlicher Arbeit und menschlichen Verstehens, nach beruflichen Perspektiven und danach, wer \xFCber den Einsatz und die Entwicklung dieser Technologien entscheidet und wer davon profitiert. Unsere Erfahrungen k\xF6nnen auch zur Gestaltung dieses Wandels in anderen Bereichen beitragen. Umso dringlicher erscheint es uns, die Diskussion zu f\xFChren, begr\xFCndete Positionen zu entwickeln und unsere Erfahrungen in die gesellschaftliche Verst\xE4ndigung einzubringen.","Mit diesen \xDCberlegungen m\xF6chten wir uns gemeinsam dar\xFCber verst\xE4ndigen, wie wir Mathematik in Forschung und Lehre k\xFCnftig gestalten wollen, welche F\xE4higkeiten und Werte wir bewahren und weiterentwickeln m\xF6chten und welche Perspektiven Mathematiker:innen in der Gesellschaft haben sollen.","Welche Grunds\xE4tze \xFCberzeugen euch, wo widersprecht ihr und was fehlt? Wir werten eure Beitr\xE4ge aus, \xFCberarbeiten die Papiere und machen \xC4nderungen sowie offene Streitpunkte sichtbar."],en:["We address the mathematical community at a time of great uncertainty. The development of artificial intelligence touches our understanding of mathematics, our practice in research and teaching, and mathematicians\u2019 career prospects. It opens new possibilities for mathematical discovery, understanding and collaborative research, while also bringing risks. Its further development and consequences are only partly foreseeable, and become less so the further we look into the future. We take seriously the concerns this development raises for many people about their professional future and the significance of their work. At the same time, we recognise the responsibility that comes with our position in academia and want to help shape these changes through an open, collective process of deliberation.","We also see the current opportunities, problems and challenges within mathematics as precursors of similar, and possibly even more far-reaching, developments in other parts of society. They raise questions beyond our discipline: about the value of human work and human understanding, about career prospects, and about who decides how these technologies are used and developed and who benefits from them. Our experiences can also contribute to shaping this transition in other fields. This makes it all the more urgent to have these discussions, develop reasoned positions and bring our experiences into the wider public debate.","With these reflections, we want to work towards a shared understanding of how we wish to shape mathematics in research and teaching, which abilities and values we want to preserve and develop, and what prospects mathematicians should have in society.","Which principles do you find convincing, where do you disagree, and what is missing? We review your contributions, revise the papers, and make changes and unresolved points of disagreement visible."]};
